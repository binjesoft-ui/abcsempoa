let PORTRAIT=ORIENT==='portrait';
let GW=PORTRAIT?720:1280, GH=PORTRAIT?1280:720;
// HD: the canvas is drawn at the device's real resolution (up to 2x) and the camera zooms in,
// so beads, text and lines stay sharp on phone screens instead of being stretched.
const calcHD=()=>clamp((window.devicePixelRatio||1)*Math.min((window.innerWidth||GW)/GW,(window.innerHeight||GH)/GH),1,2);
let HD=calcHD();
let GAME=null, REOPEN_OPTS=false;
const TEX_R=2; // bead textures are drawn at 2x and shown at half size

  purple:0xb36bd6,blue:0x4fa3f7,paper:0xfffdf7,line:0xe8eef2,wood:0xb36b38,woodD:0x6e3d1a,ink:0x24323d};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------------------------------------------------------------- sound
let actx=null, muted=store.get('sempoaMute','0')==='1';
function tone(f,d,type='triangle',delay=0,vol=.14){ if(muted) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){} }
const sfx={
  clack:()=>{tone(1200,.04,'square',0,.05);tone(500,.06,'triangle',.01,.08)},
  click:()=>tone(660,.08),
  ding:()=>{tone(988,.1,'sine',0,.1);tone(1319,.14,'sine',.07,.08)},
  good:()=>{tone(523,.12);tone(659,.12,'triangle',.1);tone(784,.2,'triangle',.2)},
  bad:()=>{tone(220,.2,'sawtooth',0,.08);tone(160,.3,'sawtooth',.15,.08)},
  pinch:()=>{tone(880,.1,'sine',0,.1);tone(1320,.15,'sine',.06,.1)},
  star:k=>tone(700+k*200,.2),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.12))
};

// ---------------------------------------------------------------- language
let LANG=store.get('sempoaLang','id');
const EN_ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN_TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function enWords(n){
  if(n<20) return EN_ONES[n];
  if(n<100) return EN_TENS[Math.floor(n/10)]+(n%10?'-'+EN_ONES[n%10]:'');
  if(n<1000) return EN_ONES[Math.floor(n/100)]+' hundred'+(n%100?' and '+enWords(n%100):'');
  if(n<1e6) return enWords(Math.floor(n/1000))+' thousand'+(n%1000?(n%1000<100?' and ':' ')+enWords(n%1000):'');
  if(n<1e9) return enWords(Math.floor(n/1e6))+' million'+(n%1e6?(n%1e6<100?' and ':' ')+enWords(n%1e6):'');
  return enWords(Math.floor(n/1e9))+' billion'+(n%1e9?(n%1e9<100?' and ':' ')+enWords(n%1e9):'');
}
const ID_S=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function idWords(n){
  if(n<12) return ID_S[n];
  if(n<20) return ID_S[n-10]+' belas';
  if(n<100) return ID_S[Math.floor(n/10)]+' puluh'+(n%10?' '+ID_S[n%10]:'');
  if(n<200) return 'seratus'+(n%100?' '+idWords(n%100):'');
  if(n<1000) return ID_S[Math.floor(n/100)]+' ratus'+(n%100?' '+idWords(n%100):'');
  if(n<2000) return 'seribu'+(n%1000?' '+idWords(n%1000):'');
  if(n<1e6) return idWords(Math.floor(n/1000))+' ribu'+(n%1000?' '+idWords(n%1000):'');
  if(n<1e9) return idWords(Math.floor(n/1e6))+' juta'+(n%1e6?' '+idWords(n%1e6):'');
  return idWords(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+idWords(n%1e9):'');
}

// place names: 0 = ones; 1 = tens; ...; -1 = tenths ...
function placeName(p){
  const T=L();
  if(p>=0) return T.placesFull[p]||('10^'+p);
  return T.placesDec[-p-1]||('10^'+p);
}

// ---------------------------------------------------------------- UI helpers
function txt(scene,x,y,s,size,color='#24323d',o={}){
  return scene.add.text(x,y,s,{fontFamily:o.body?BODY:FONT,fontSize:size+'px',color,fontStyle:o.weight||'800',resolution:HD,
    align:o.align||'center',wordWrap:o.wrap?{width:o.wrap,useAdvancedWrap:true}:undefined,lineSpacing:o.ls??2,
    stroke:o.stroke,strokeThickness:o.stroke?(o.st||6):0}).setOrigin(o.ox??0.5,o.oy??0.5).setPadding(4,6,4,6);
}
function btn(scene,x,y,w,h,color,label,cb,o={}){
  const c=scene.add.container(x,y);
  const g=scene.add.graphics();
  const dark=Phaser.Display.Color.ValueToColor(color).darken(o.white?6:20).color;
  const r=o.radius??Math.min(h/2,30);
  const t=txt(scene,0,0,label,o.size||28,o.textColor||'#ffffff');
  const draw=pr=>{g.clear();
    g.fillStyle(o.white?0xdfe7ec:dark,1).fillRoundedRect(-w/2,-h/2+7,w,h,r);
    g.fillStyle(color,1).fillRoundedRect(-w/2,-h/2+(pr?5:0),w,h,r);
    if(o.white) g.lineStyle(3,0xe1e8ed,1).strokeRoundedRect(-w/2,-h/2+(pr?5:0),w,h,r);
    t.y=pr?5:0; if(c.extra) c.extra.forEach(e=>e.y=e.baseY+(pr?5:0));};
  const z=scene.add.zone(0,3,w,h+7).setInteractive({useHandCursor:true});
  c.add([g,t,z]); c.label=t; c.extra=[]; draw(false);
  let pressed=false,fired=false;
  z.on('pointerdown',()=>{pressed=true;draw(true)});
  z.on('pointerout',()=>{if(pressed){pressed=false;draw(false)}});
  z.on('pointerup',()=>{if(!pressed)return;pressed=false;draw(false);
    if(o.once){if(fired)return;fired=true;}
    sfx.click();
    // run the action on the next tick, after Phaser has finished handling this tap
    if(cb) scene.time.delayedCall(0,()=>{ if(scene.sys.isActive()) cb(); });
  });
  c.setEnabled=v=>{z.input.enabled=v;c.setAlpha(v?1:.45)};
  return c;
}
function panel(scene,x,y,w,h,fill=0xf3fbfe,stroke=null,r=26){
  const g=scene.add.graphics();
  g.fillStyle(fill,1).fillRoundedRect(x,y,w,h,r);
  if(stroke!==null) g.lineStyle(3,stroke,1).strokeRoundedRect(x,y,w,h,r);
  return g;
}
function drawBg(scene){
  scene.cameras.main.setBackgroundColor('#ffd59a').setZoom(HD).centerOn(GW/2,GH/2);
  for(let i=0;i<8;i++){const b=scene.add.circle(rnd(0,GW),rnd(0,GH),rnd(14,46),0xffffff,.28);
    scene.tweens.add({targets:b,y:'-=900',duration:rnd(14000,24000),repeat:-1,onRepeat:()=>{b.y=GH+60;b.x=rnd(0,GW)}});}
  const g=scene.add.graphics();
  g.fillStyle(0xd99a52,1).fillRoundedRect(12,18,GW-24,GH-26,32);
  g.fillStyle(C.paper,1).fillRoundedRect(12,12,GW-24,GH-26,32);
}
const TOPY=52;
function topBar(scene,title,o={}){
  if(o.home!==false) btn(scene,74,TOPY,100,58,0xffffff,'🏠',()=>scene.scene.start('Home'),{white:true,size:28,textColor:'#24323d'});
  if(title) txt(scene,o.titleX??GW/2,TOPY,title,30,'#2a9fc4',{ox:o.titleX?0:0.5});
  optionsButton(scene,o.data||{},o.note);
  if(o.data&&o.data._opts) openOptions(scene,o.data,o.note);
}
function optionsButton(scene,data,note,x=GW-74,y=TOPY){
  return btn(scene,x,y,100,58,0xffffff,'⚙️',()=>openOptions(scene,data,note),{white:true,size:28,textColor:'#24323d'});
}
// a row of 2+ toggle buttons; the active one is filled teal
function seg(scene,cx,y,w,items,h=60){
  const n=items.length,bw=(w-(n-1)*12)/n;
  return items.map((it,i)=>btn(scene,cx-w/2+bw/2+i*(bw+12),y,bw,h,it.active?C.teal:0xffffff,it.label,it.active?null:it.cb,
    {white:!it.active,textColor:it.active?'#ffffff':'#2f7f93',size:it.size||22}));
}
// dimmed backdrop + paper panel, used by Options and Guide
function modalBase(scene,w,h){
  if(scene._optC){scene._optC.destroy();scene._optC=null;}
  const c=scene.add.container(0,0).setDepth(300);scene._optC=c;
  c.add(scene.add.rectangle(GW/2,GH/2,GW,GH,0x1b2a33,.5).setInteractive());
  const x0=(GW-w)/2,y0=(GH-h)/2;
  c.add(panel(scene,x0,y0+10,w,h,0xd99a52,null,32));c.add(panel(scene,x0,y0,w,h,C.paper,0xffd59a,32));
  c.setAlpha(0);scene.tweens.add({targets:c,alpha:1,duration:180});
  c.close=()=>{c.destroy();if(scene._optC===c)scene._optC=null;};
  return {c,x0,y0};
}
// ⚙️ Options: language, bead colour, layout, sound + About (made by Binjesoft, version)
function openOptions(scene,data={},note){
  const T=L(),P=PORTRAIT,w=P?640:1000,h=P?1110:664,{c,x0,y0}=modalBase(scene,w,h);
  const clean={...data};delete clean._opts;
  c.add(txt(scene,GW/2,y0+46,T.options,38,'#2f7f93'));
  const apply=restart=>{ if(restart) scene.scene.restart({...clean,_opts:true}); else openOptions(scene,data,note); };
  const colW=P?w-88:500,lx=x0+44; let y=y0+104;
  const row=(label,items)=>{c.add(txt(scene,lx,y,label,24,'#24323d',{ox:0}));y+=48;seg(scene,lx+colW/2,y,colW,items,58).forEach(b=>c.add(b));y+=72;};
  row('🌐 '+T.language,[
    {label:'Indonesia',active:LANG==='id',cb:()=>{LANG='id';store.set('sempoaLang','id');apply(true);}},
    {label:'English',active:LANG==='en',cb:()=>{LANG='en';store.set('sempoaLang','en');apply(true);}}]);
  row('🖥️ '+T.layout,[
    {label:T.landscape,active:!P,cb:()=>setOrientation('landscape',true)},
    {label:T.portrait,active:P,cb:()=>setOrientation('portrait',true)}]);
  row('🧮 '+T.beadColor,[
    {label:T.colorful,active:BEADS!=='brown',cb:()=>{BEADS='color';store.set('sempoaBeads','color');apply(true);}},
    {label:T.brown,active:BEADS==='brown',cb:()=>{BEADS='brown';store.set('sempoaBeads','brown');apply(true);}}]);
  row('🎵 '+T.sound,[
    {label:T.on,active:!muted,cb:()=>{muted=false;store.set('sempoaMute','0');apply(false);}},
    {label:T.off,active:muted,cb:()=>{muted=true;store.set('sempoaMute','1');apply(false);}}]);
  if(note){c.add(txt(scene,lx+colW/2,y-10,note,17,'#8c99a3',{body:true,wrap:colW}));y+=20;}
  // About
  if(P){
    const g=scene.add.graphics();g.lineStyle(3,C.line,1).lineBetween(x0+40,y+4,x0+w-40,y+4);c.add(g);y+=24;
    c.add(txt(scene,lx,y+10,'ℹ️ '+T.about,24,'#24323d',{ox:0}));y+=42;
    c.add(panel(scene,x0+34,y,w-68,200,0xf3fbfe,0xcdeefa,24));
    if(scene.textures.exists('kid')) c.add(scene.add.image(x0+120,y+100,'kid').setScale(.25));
    c.add(txt(scene,x0+214,y+44,'ABC Sempoa',36,'#ff6a1a',{ox:0}));
    c.add(txt(scene,x0+216,y+88,T.version(VERSION),22,'#2f7f93',{ox:0,body:true}));
    c.add(txt(scene,x0+216,y+124,T.madeBy,22,'#24323d',{ox:0,body:true}));
    c.add(txt(scene,x0+216,y+160,'© 2026 Binjesoft',18,'#8c99a3',{ox:0,body:true}));
  } else {
    const ax=x0+600,aw=w-644;
    const g=scene.add.graphics();g.lineStyle(3,C.line,1).lineBetween(x0+575,y0+100,x0+575,y0+h-110);c.add(g);
    c.add(txt(scene,ax,y0+104,'ℹ️ '+T.about,24,'#24323d',{ox:0}));
    c.add(panel(scene,ax,y0+142,aw,320,0xf3fbfe,0xcdeefa,24));
    if(scene.textures.exists('kid')) c.add(scene.add.image(ax+aw/2,y0+226,'kid').setScale(.2));
    c.add(txt(scene,ax+aw/2,y0+322,'ABC Sempoa',36,'#ff6a1a'));
    c.add(txt(scene,ax+aw/2,y0+364,T.version(VERSION),22,'#2f7f93',{body:true}));
    c.add(txt(scene,ax+aw/2,y0+398,T.madeBy,22,'#24323d',{body:true}));
    c.add(txt(scene,ax+aw/2,y0+432,'© 2026 Binjesoft',18,'#8c99a3',{body:true}));
  }
  c.add(btn(scene,GW/2,y0+h-52,300,70,C.orange,T.close,()=>c.close(),{size:28}));
}
// ❓ Guide: how the full sempoa and the practice screen work
function openGuide(scene){
  const T=L(),P=PORTRAIT,w=P?660:920,h=P?900:580,{c,x0,y0}=modalBase(scene,w,h);
  c.add(txt(scene,GW/2,y0+46,T.guideT,36,'#2f7f93'));

function confetti(scene){
  const e=scene.add.particles(0,0,'conf',{speed:{min:300,max:750},angle:{min:200,max:340},gravityY:1100,lifespan:1800,
    scale:{start:1,end:.7},rotate:{min:0,max:360},tint:[0xff6a1a,0x4cc3e8,0xffd23f,0x2ec27e,0xff4d6d,0xb36bd6],emitting:false}).setDepth(100);
  return n=>e.explode(n,GW/2,GH*0.45);
}
// feedback card that slides up from the bottom (button on the right in landscape, below in portrait)
function sheet(scene,{kind,emoji,title,body,btnLabel,onBtn}){
  const P=PORTRAIT,w=P?670:820,cx=GW/2,side=btnLabel&&!P;
  const col={good:[0xe3f8ee,0xb5ecd1,'#1b9b62'],bad:[0xffe9ee,0xffc4d0,'#d93355'],info:[0xf3fbfe,0xcdeefa,'#2f7f93']}[kind];
  const c=scene.add.container(cx,GH+20).setDepth(50);
  const tw=side?w-400:w-140;
  const tt=txt(scene,-w/2+110,20,title,30,col[2],{ox:0,oy:0,wrap:tw,align:'left'});
  const bt=txt(scene,-w/2+110,20+tt.height,body,21,'#24323d',{body:true,weight:'700',ox:0,oy:0,wrap:tw,align:'left',ls:3});
  let h=bt.y+bt.height+20; if(side) h=Math.max(h,130); else if(btnLabel) h+=96;
  const g=scene.add.graphics();
  g.fillStyle(0x000000,.08).fillRoundedRect(-w/2,8,w,h,28);
  g.fillStyle(col[0],1).fillRoundedRect(-w/2,0,w,h,28);g.lineStyle(4,col[1],1).strokeRoundedRect(-w/2,0,w,h,28);
  const em=txt(scene,-w/2+58,56,emoji,58);
  c.add([g,em,tt,bt]);
  if(btnLabel){const b=side?btn(scene,w/2-150,h/2,240,76,C.orange,btnLabel,onBtn,{size:30,once:true})
                            :btn(scene,0,h-58,300,74,C.orange,btnLabel,onBtn,{size:30,once:true});c.add(b);}
  scene.tweens.add({targets:c,y:GH-24-h,duration:380,ease:'Back.Out'});
  return c;
}

const THUMB_ORIGIN=[0.078,0.073], THUMB_W=96; // display width in sempoa units
const PX=p=>p.worldX??p.x, PY=p=>p.worldY??p.y; // pointer in game-world units
// Geometry in local (unscaled) units. Beads 120 x 48 on rods 132 apart.
const AB={PAD:18,BW:120,BH:48,BEAM_H:16,RW:132,TRAVEL:66};
const H_OFF=6, H_ON=H_OFF+AB.TRAVEL;
AB.BEAM_TOP=H_ON+AB.BH+2;
const E_ACT0=AB.BEAM_TOP+AB.BEAM_H+2, E_FREE0=E_ACT0+AB.TRAVEL;
AB.ROD_H=E_FREE0+4*AB.BH+6;

const PINCH_GRACE=450; // ms: top + bottom moves this close together still count as one pinch
let BEADS=store.get('sempoaBeads','color');               // 'color' | 'brown'
const yH=on=>AB.PAD+(on?H_ON:H_OFF);
const yE=(k,on)=>AB.PAD+(on?E_ACT0:E_FREE0)+k*AB.BH;
const BEAD_COLORS=[[0xff9bbb,0xe04877],[0xffdc6a,0xd99a00],[0x7fd4fb,0x1f93c9],[0x94e6a6,0x34a250]];
const BEAD_BROWN=[0xe2b47c,0x6b4220];

/* opts: scale, unit (index of the ones rod from the left; default = last rod),
         labels 'full'|'digits'|'none', viewW (visible width in px; wider sempoa scrolls with a slider),
         glow [places], hideDigits, onChange(value) */
class Abacus{
  constructor(scene,cx,top,rods,opts={}){
    Object.assign(this,{s:scene,n:rods,opts,locked:false,fingers:0,drags:new Map(),busy:new Set(),dead:false,extras:[]});
    this.k=opts.scale||1; this.u=opts.unit??(rods-1); this.labels=opts.labels||'full'; this.top=top; this.cx=cx;
    this.state=Array.from({length:rods},()=>({h:0,e:0}));
    const W=rods*AB.RW+2*AB.PAD, H=abHeight(this.labels), k=this.k;
    this.W=W; this.Hpx=H*k;
    const fullW=W*k; this.fullW=fullW;
    this.viewW=opts.viewW&&opts.viewW<fullW?opts.viewW:fullW;
    this.scrolls=this.viewW<fullW;
    this.vx0=cx-this.viewW/2; this.scrollX=0; this.maxScroll=fullW-this.viewW;
    this.totalH=this.Hpx+(this.scrolls?66:0);
    const c=this.c=scene.add.container(this.vx0,top).setScale(k);
    // frame
    const g=scene.add.graphics();
    g.fillStyle(C.woodD,1).fillRoundedRect(0,8,W,H,24);
    g.fillStyle(C.wood,1).fillRoundedRect(0,0,W,H,24);
    g.fillStyle(0xc98450,1).fillRoundedRect(6,4,W-12,8,5);
    g.fillStyle(0xfff8ec,1).fillRoundedRect(AB.PAD-6,AB.PAD,W-2*AB.PAD+12,AB.ROD_H,12);
    c.add(g);
    this.glowG=scene.add.graphics(); c.add(this.glowG);
    const g2=scene.add.graphics(); c.add(g2);
    this.rodX=[];this.beads=[];this.digitT=[];
    for(let r=0;r<rods;r++){const x=AB.PAD+AB.RW*r+AB.RW/2;this.rodX.push(x);
      g2.fillStyle(0x9c9c9c,1).fillRect(x-4,AB.PAD+4,8,AB.ROD_H-8);g2.fillStyle(0xe6e6e6,1).fillRect(x-1.5,AB.PAD+4,3,AB.ROD_H-8);}
    const beamY=AB.PAD+AB.BEAM_TOP;
    g2.fillStyle(C.woodD,1).fillRect(AB.PAD-6,beamY,W-2*AB.PAD+12,AB.BEAM_H);
    // unit dots: every 3rd rod counted from the ones rod; the ones rod gets a bigger orange dot + ▼ marker
    for(let r=0;r<rods;r++){const x=this.rodX[r],d=this.u-r;

      else if(d%3===0){g2.fillStyle(0x3a2416,1).fillCircle(x,beamY+AB.BEAM_H/2,7);g2.fillStyle(0xffffff,1).fillCircle(x,beamY+AB.BEAM_H/2,5);}}
    if(rods>3){const x=this.rodX[this.u];
      g2.fillStyle(0xffb547,1).fillTriangle(x-20,-4,x+20,-4,x,16);g2.lineStyle(2,0x3a2416,1).strokeTriangle(x-20,-4,x+20,-4,x,16);}
    for(let r=0;r<rods;r++){
      const x=this.rodX[r],place=this.u-r,tex=BEADS==='brown'?'beadBrown':'bead'+(((place%4)+4)%4);
      const mk=()=>{const im=scene.add.image(x,0,tex).setOrigin(.5,0).setScale(1/TEX_R);c.add(im);return im;};
      const h=mk(),e=[0,1,2,3].map(mk);
      this.beads.push({h,e});
      // big invisible touch zones: above the bar grabs the top bead, below grabs the nearest bottom bead
      const zH=scene.add.zone(x,AB.PAD+AB.BEAM_TOP/2,AB.RW,AB.BEAM_TOP).setInteractive({useHandCursor:true});
      zH.on('pointerdown',p=>this.grab(p,r,'h',0));

      zE.on('pointerdown',p=>this.grab(p,r,'e',this.nearestEarth(r,p)));
      c.add([zH,zE]);
      if(this.labels==='full'){
        c.add(txt(scene,x,AB.PAD+AB.ROD_H+30,placeName(place),20,'#ffffff'));

      } else if(this.labels==='digits'){

      }
    }

  up(p){

  update(instant){

  // whole-number part from the rods up to the unit rod, decimals from the rods after it

  // ---------- teaching animations ----------
  moveCaption(place,s0,h1,e1){

  }
  // "Contohkan" / Help: show how to get from the current beads to n, then put the beads back
  demo(n,onStep,done){
    if(this.demoing||this.animating) return; this.demoing=true;
    const saved=this.state.map(s=>({...s})),savedScroll=this.scrollX,wasLocked=this.locked; this.lock(true);
    const S=L().soro,D=this.digitsFor(n),cur=this.state.map(s=>({...s}));

    for(let r=0;r<this.n;r++){
      const d=D[r],h1=d>=5?1:0,e1=d%5,place=this.u-r;
      if(cur[r].h===h1&&cur[r].e===e1) continue;
      steps.push({place,t:this.moveCaption(place,cur[r],h1,e1),pause:650,run:cb=>this.fingerMove(r,d,cb,1100)});
      cur[r]={h:h1,e:e1};
    }
    steps.push({t:S.yourTurn,pause:1500,run:cb=>{sfx.good();cb();}});
    this.runSteps(steps,onStep,()=>{ if(this.dead) return;
      this.state=saved;this.opts.glow=this.baseGlow.slice();this.update();if(this.scrolls)this.tweenScroll(savedScroll);
      this.lock(wasLocked);this.demoing=false;this.resetTechnique();done&&done();});
  }
  reveal(){this.opts.hideDigits=false;this.update();}
  lock(v){this.locked=v;}
}

function explain(n,rods){
  const s=String(n).padStart(rods,'0'),out=[];
  for(let k=0;k<rods;k++){const d=+s[k];out.push(`${placeName(rods-1-k)} ${d} → ${L().digit(d)}`);}
  return out.join('\n');
}
const placeNames=list=>list.map(p=>placeName(p)).join(L().and);


// ---------------------------------------------------------------- ABC Sempoa mascot: anime-style kid holding a sempoa (original SVG)

class Boot extends Phaser.Scene{
  constructor(){super('Boot')}
  create(){
    // Sharp double-cone (spindle) beads like a real soroban, drawn with canvas gradients at 2x.
    const hex=n=>'#'+n.toString(16).padStart(6,'0');
    const mix=(a,b,t)=>{const A=[a>>16,(a>>8)&255,a&255],B=[b>>16,(b>>8)&255,b&255];
      return (A.map((v,k)=>Math.round(v+(B[k]-v)*t)).reduce((n,v)=>(n<<8)|v,0));};
    const drawBead=(key,[light,dark])=>{
      const S=TEX_R,w=AB.BW*S,h=AB.BH*S,ct=this.textures.createCanvas(key,w,h),x=ct.getContext();
      const mid=mix(light,dark,.45),hi=mix(light,0xffffff,.55),lo=mix(dark,0x000000,.35);
      const e=1.2*S,t0=w*.31,t1=w*.69,cy=h/2;
      const shape=()=>{x.beginPath();x.moveTo(1,cy);x.lineTo(t0,e);x.lineTo(t1,e);x.lineTo(w-1,cy);x.lineTo(t1,h-e);x.lineTo(t0,h-e);x.closePath();};
      // top face: bright at the top, toward the base colour at the ridge
      x.beginPath();x.moveTo(1,cy);x.lineTo(t0,e);x.lineTo(t1,e);x.lineTo(w-1,cy);x.closePath();
      let g=x.createLinearGradient(0,0,0,cy);g.addColorStop(0,hex(hi));g.addColorStop(.45,hex(light));g.addColorStop(1,hex(mid));
      x.fillStyle=g;x.fill();
      // bottom face: dark under the ridge, a little reflected light lower down
      x.beginPath();x.moveTo(1,cy);x.lineTo(w-1,cy);x.lineTo(t1,h-e);x.lineTo(t0,h-e);x.closePath();
      g=x.createLinearGradient(0,cy,0,h);g.addColorStop(0,hex(lo));g.addColorStop(.55,hex(dark));g.addColorStop(1,hex(mid));
      x.fillStyle=g;x.fill();
      x.save();shape();x.clip();
      // darker pointed tips (round, 3-D look)
      g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(0,0,0,.30)');g.addColorStop(.22,'rgba(0,0,0,0)');
      g.addColorStop(.78,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.30)');x.fillStyle=g;x.fillRect(0,0,w,h);
      // shine lines on the top face
      x.fillStyle='rgba(255,255,255,.55)';x.fillRect(t0+3*S,e+2.5*S,(t1-t0)-6*S,1.4*S);
      x.fillStyle='rgba(255,255,255,.28)';x.fillRect(w*.20,h*.30,w*.60,1.2*S);
      // crisp highlight just above the ridge + the ridge itself
      x.fillStyle='rgba(255,255,255,.65)';x.fillRect(w*.07,cy-2.6*S,w*.86,1.3*S);
      x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,cy-.5*S,w,1.3*S);
      // the rod running through the bead
      g=x.createLinearGradient(w/2-4*S,0,w/2+4*S,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g;x.fillRect(w/2-4*S,0,8*S,h);
      x.restore();
      shape();x.lineWidth=1.3*S;x.strokeStyle=hex(lo);x.stroke();
      ct.refresh();
    };
    BEAD_COLORS.forEach((c,i)=>drawBead('bead'+i,c));
    drawBead('beadBrown',BEAD_BROWN);
    const g=this.make.graphics({add:false});g.fillStyle(0xffffff,1).fillRect(0,0,14,9);g.generateTexture('conf',14,9);g.destroy();
    const go=()=>{const el=document.getElementById('loading');if(el)el.remove();this.scene.start('Home',REOPEN_OPTS?{_opts:true}:{});REOPEN_OPTS=false;};
    const imgs=[['kid','data:image/svg+xml;charset=utf-8,'+encodeURIComponent(kidSVG())],['thumb',THUMB_PNG],['jepitOpen',JEPIT_OPEN],['jepitClosed',JEPIT_CLOSED]];
    let left=imgs.length; const done=()=>{if(--left===0)go();};
    imgs.forEach(([key,src])=>{const img=new Image();
      img.onload=()=>{this.textures.addImage(key,img);done();}; img.onerror=done; img.src=src;});
  }
}

    let ts=30,bs=23,ks=24,tt,xt,tk;

      [tt,xt,tk].forEach(o=>o&&o.destroy());
      tt=txt(this,left+96,top+12,Ls.t[LANG],ts,'#2f7f93',{ox:0,oy:0,wrap:w-112,align:'left'});
      xt=txt(this,left+96,tt.y+tt.height-4,Ls.x[LANG],bs,'#24323d',{body:true,weight:'700',ox:0,oy:0,wrap:w-112,align:'left',ls:3});
      tk=txt(this,left+96,xt.y+xt.height,Ls.task[LANG],ks,'#e0520a',{body:true,ox:0,oy:0,wrap:w-112,align:'left'});
      if(tk.y+tk.height<=top+PH-6||bs<=15) break;
      bs--; ks=Math.max(17,ks-1); if(bs<20) ts=Math.max(24,ts-1);
    }
    // abacus: always the same size and place
    const abCX=P?GW/2:940,abTop=P?478:112;

    if(Ls.start) this.ab.set(Ls.start,true);
    txt(this,abCX,abTop+this.ab.Hpx+32,T.hint,17,'#7b8a95',{body:true,wrap:P?640:620});
    // number + words
    const vy=P?1094:508;
    this.valBg=panel(this,left,vy-34,170,68,0xffffff,C.line,18);
    this.valT=txt(this,left+85,vy,'0',44,'#2a9fc4');
    this.wordT=txt(this,left+190,vy,'',21,'#8c99a3',{body:true,ox:0,wrap:w-190,align:'left'});
    this.capT=txt(this,left+w/2,vy,'',21,'#2f7f93',{body:true,wrap:w}).setVisible(false); // demo captions
    // buttons: back · reset · show me
    const by=P?1200:636,busy=()=>this.sheet||this.ab.demoing;
    const B=P?[[134,200],[360,200],[586,200]]:[[left+92,184],[left+282,180],[left+474,192]];
    const back=btn(this,B[0][0],by,B[0][1],70,0xffffff,T.prev,()=>{if(!busy())this.scene.start('Learn',{i:this.i-1})},{white:true,textColor:'#2f7f93',size:24});
    if(this.i===0) back.setEnabled(false);
    btn(this,B[1][0],by,B[1][1],70,0xffffff,T.reset,()=>{if(busy())return;this.ab.set(Ls.start||0);this.show(this.ab.value())},{white:true,textColor:'#2f7f93',size:24});
    btn(this,B[2][0],by,B[2][1],70,C.purple,T.showMe,()=>{
      if(busy())return;
      this.ab.set(Ls.start||0);this.show(this.ab.value());
      [this.valBg,this.valT,this.wordT].forEach(o=>o.setVisible(false));this.capT.setVisible(true);
      this.ab.demo(Ls.target,t=>this.capT.setText(t),()=>{
        this.capT.setVisible(false);[this.valBg,this.valT,this.wordT].forEach(o=>o.setVisible(true));this.show(this.ab.value());});
    },{size:24});
    this.done=false; this.show(this.ab.value());
  }
  show(v){this.valT.setText(String(v));this.wordT.setText(L().words(v));}
  check(v){
    this.show(v); if(this.done) return;
    const Ls=LESSONS[this.i],T=L();
    if(v!==Ls.target) return;
    const errs=Ls.pinch?this.ab.techniqueErrors():[];
    this.done=true; this.ab.lock(true);
    if(errs.length){
      sfx.bad(); this.cameras.main.shake(200,.006);
      this.sheet=sheet(this,{kind:'bad',emoji:'🙈',title:T.wrongMoveT,body:T.wrongMoveB(placeNames(errs))});
      this.time.delayedCall(2800,()=>{
        this.tweens.add({targets:this.sheet,y:GH+40,duration:300,onComplete:()=>{this.sheet.destroy();this.sheet=null;}});
        this.ab.set(Ls.start||0);this.ab.lock(false);this.show(this.ab.value());this.done=false;});
      return;
    }
    sfx.good(); this.burst(70);
    const last=this.i===LESSONS.length-1;
    this.sheet=sheet(this,{kind:'good',emoji:'🎉',title:pickOne(T.wellDone),body:explain(v,Ls.rods),
      btnLabel:last?T.finish:T.next,onBtn:()=>last?this.scene.start('Cert'):this.scene.start('Learn',{i:this.i+1})});
  }
}

// ---------------------------------------------------------------- CHALLENGE (full sempoa practice)
// <challenge-generator>  — also run by tools/make-challenges.js, so keep it self-contained
// Daily and weekly sets come from a seeded random generator: everyone gets the same 10 questions
// on the same day / in the same week, and new ones appear by themselves.
const PLANS={
  daily:[{t:'build',a:[1]},{t:'build',a:[2]},{t:'calc',a:[1,1],ops:'+'},{t:'calc',a:[1,1],ops:'-'},{t:'calc',a:[1,1,1]},
    {t:'build',a:[3]},{t:'calc',a:[2,2],ops:'+'},{t:'calc',a:[2,2],ops:'-'},{t:'calc',a:[2,2,2]},{t:'calc',a:[3,2]}],
  weekly:[{t:'build',a:[2]},{t:'build',a:[3]},{t:'calc',a:[2,2],ops:'+'},{t:'calc',a:[2,2],ops:'-'},{t:'calc',a:[2,2,2]},
    {t:'build',a:[4]},{t:'calc',a:[3,2],ops:'+'},{t:'calc',a:[3,2],ops:'-'},{t:'calc',a:[3,2,2]},{t:'calc',a:[3,3]}]
};
function seededRng(str){ // FNV-1a hash of the seed → mulberry32
  let h=2166136261>>>0; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  let a=h; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
function makeQ(P,R=Math.random){
  const ri=(a,b)=>a+Math.floor(R()*(b-a+1)), rd=d=>d===1?ri(1,9):ri(10**(d-1),10**d-1);
  if(P.t==='build') return {type:'build',answer:rd(P.a[0])};
  for(let t=0;t<500;t++){
    const terms=[rd(P.a[0])],totals=[terms[0]]; let tot=terms[0],ok=true;
    for(let i=1;i<P.a.length;i++){
      const op=P.ops||(R()<.5?'+':'-'),v=rd(P.a[i]),nt=op==='+'?tot+v:tot-v;
      if(nt<0||nt>9999){ok=false;break;}
      terms.push(op==='+'?v:-v); tot=nt; totals.push(tot);
    }
    if(ok) return {type:'calc',terms,totals,answer:tot};
  }
  return {type:'build',answer:ri(1,9)};
}
const seedFor=(mode,key)=>`abcsempoa:${mode}:${key}`;
function makeSet(mode,key){ const R=key?seededRng(seedFor(mode,key)):Math.random; return PLANS[mode].map(p=>makeQ(p,R)); }
const pad2=n=>String(n).padStart(2,'0');
function dayKey(d=new Date()){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function weekKey(d=new Date()){ // ISO week, weeks start on Monday
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear(),w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7);
  return `${y}-W${pad2(w)}`;
}
// a published question file is used only if every question is well-formed
function validSet(qs){
  return Array.isArray(qs)&&qs.length===10&&qs.every(q=>{
    if(!q||!Number.isInteger(q.answer)||q.answer<0||q.answer>9999) return false;
    if(q.type==='build') return true;
    if(q.type!=='calc'||!Array.isArray(q.terms)||q.terms.length<2||q.terms.length>3) return false;
    let t=0;const totals=q.terms.map(v=>t+=v);
    return q.terms.every(Number.isInteger)&&totals.every(v=>v>=0&&v<=9999)&&t===q.answer;
  });
}
// </challenge-generator>
const withTotals=qs=>qs.map(q=>q.type==='calc'?{...q,totals:(t=>q.terms.map(v=>t+=v))(0)}:{...q});
// Use the published file for today/this week when the game is hosted next to it (GitHub Pages);
// otherwise generate the identical set here.
async function loadSet(mode){
  const key=mode==='weekly'?weekKey():dayKey();
  try{
    const ctl=typeof AbortController!=='undefined'?new AbortController():null;
    const tm=setTimeout(()=>ctl&&ctl.abort(),1500);
    const r=await fetch(`challenges/${mode}/${key}.json`,{cache:'no-store',signal:ctl&&ctl.signal}); clearTimeout(tm);
    if(r.ok){const j=await r.json(); if(validSet(j.questions)) return {mode,key,qs:withTotals(j.questions),source:'file'};}
  }catch(e){}
  return {mode,key,qs:makeSet(mode,key),source:'generated'};
}
function startChallenge(scene,mode){
  if(scene._loading) return; scene._loading=true;
  loadSet(mode).then(set=>{ if(scene.sys.isActive()) scene.scene.start('Challenge',set); });
}

        btn(this,87+ci*80,240+ri*66,72,56,fn?0xffffff:C.blue,k,()=>this.key(k),{white:fn,textColor:fn?'#2f7f93':'#ffffff',size:30,radius:16});}));
      this.goBtn=btn(this,167,530,240,68,C.orange,T.show,()=>this.go(),{size:26});
      this.capT=txt(this,167,580,T.typeHint,18,'#2f7f93',{body:true,wrap:250,oy:0});
    }
  }
  key(k){
    if(this.ab.animating) return;
    if(k==='⌫') this.entry=this.entry.slice(0,-1);
    else if(k==='C') this.entry='';
    else if(this.entry.length<9) this.entry=(this.entry+k).replace(/^0+(?=\d)/,'');
    this.inT.setText(this.entry||'_').setFontSize(this.entry.length>6?32:44);
  }
  go(){
    if(this.ab.animating) return;
    if(this.entry===''){this.tweens.add({targets:this.inT,x:this.inX+10,yoyo:true,repeat:2,duration:50});return;}
    const n=+this.entry; this.goBtn.setEnabled(false);
    this.ab.sorobanTo(n,t=>this.capT.setText(t),()=>{
      this.capT.setText(`${L().soro.done(n)}\n${L().words(n)}`);this.goBtn.setEnabled(true);
    });
  }
}

// =====================================================================
function setOrientation(o,reopen){
  if(o===ORIENT) return;
  ORIENT=o; store.set('sempoaOrient',o); REOPEN_OPTS=!!reopen;
  if(GAME){GAME.destroy(true);GAME=null;}
  setTimeout(startGame,150); // Phaser finishes destroying the old game on its next frame
}
function startGame(){
  PORTRAIT=ORIENT==='portrait'; GW=PORTRAIT?720:1280; GH=PORTRAIT?1280:720; HD=calcHD();
  GAME=new Phaser.Game({
    type:Phaser.AUTO, parent:'game', width:Math.round(GW*HD), height:Math.round(GH*HD), backgroundColor:'#ffd59a',
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
    input:{activePointers:4},
    scene:[Boot,Home,Learn,Cert,Challenge,Result,Free]
  });
  checkRotate();
}
// phone/tablet held the other way from the chosen layout → hint, with a one-tap switch
let rotDismissed=null;
function checkRotate(){
  const el=document.getElementById('rotate'); if(!el) return;
  const W=window.innerWidth,H=window.innerHeight,small=Math.min(W,H)<=900;
  const devicePortrait=H>W, mismatch=small&&devicePortrait!==PORTRAIT, key=ORIENT+(devicePortrait?'P':'L');
  if(!mismatch||rotDismissed===key){el.style.display='none';return;}
  const T=L();
  document.getElementById('rotIc').textContent=PORTRAIT?'📱':'🖥️';
  document.getElementById('rotT').textContent=PORTRAIT?T.rotP:T.rotL;
  const sw=document.getElementById('rotSwitch'); sw.textContent=devicePortrait?T.useP:T.useL;
  sw.onclick=()=>{el.style.display='none';setOrientation(devicePortrait?'portrait':'landscape');};
  document.getElementById('rotOk').onclick=()=>{rotDismissed=key;el.style.display='none';};
  el.style.display='flex';
}
if(window.addEventListener){window.addEventListener('resize',checkRotate);window.addEventListener('orientationchange',checkRotate);}
const fontsReady=(document.fonts&&document.fonts.load)
  ? Promise.race([Promise.all([document.fonts.load('800 40px "Baloo 2"'),document.fonts.load('700 24px "Nunito"'),document.fonts.load('800 24px "Nunito"')]).catch(()=>{}),new Promise(r=>setTimeout(r,2500))])
  : Promise.resolve();
fontsReady.then(()=>startGame());
}
// wait for the engine (it may come from the fallback CDN) before defining scenes
(function wait(t0){
  if(window.Phaser) return SEMPOA();
  if(Date.now()-t0>12000){document.getElementById('loading').textContent='Could not load the game engine 😢';return;}
  setTimeout(()=>wait(t0),100);
})(Date.now());
</script>
