let actx=null, muted=store.get('sempoaMute','0')==='1';
function tone(f,d,type='triangle',delay=0,vol=.14){ if(muted) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){} }
const sfx={
  clack:()=>{tone(1200,.04,'square',0,.05);tone(500,.06,'triangle',.01,.08)},
  click:()=>tone(660,.08),
  good:()=>{tone(523,.12);tone(659,.12,'triangle',.1);tone(784,.2,'triangle',.2)},
  bad:()=>{tone(220,.2,'sawtooth',0,.08);tone(160,.3,'sawtooth',.15,.08)},
  pinch:()=>{tone(880,.1,'sine',0,.1);tone(1320,.15,'sine',.06,.1)},
  star:k=>tone(700+k*200,.2),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.12))

const EN_ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN_TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function enWords(n){
  if(n<20) return EN_ONES[n];
  if(n<100) return EN_TENS[Math.floor(n/10)]+(n%10?'-'+EN_ONES[n%10]:'');
  if(n<1000) return EN_ONES[Math.floor(n/100)]+' hundred'+(n%100?' and '+enWords(n%100):'');
  return enWords(Math.floor(n/1000))+' thousand'+(n%1000?(n%1000<100?' and ':' ')+enWords(n%1000):'');
}
const ID_S=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function idWords(n){
  if(n<12) return ID_S[n];
  if(n<20) return ID_S[n-10]+' belas';
  if(n<100) return ID_S[Math.floor(n/10)]+' puluh'+(n%10?' '+ID_S[n%10]:'');
  if(n<200) return 'seratus'+(n%100?' '+idWords(n%100):'');
  if(n<1000) return ID_S[Math.floor(n/100)]+' ratus'+(n%100?' '+idWords(n%100):'');
  if(n<2000) return 'seribu'+(n%1000?' '+idWords(n%1000):'');
  return idWords(Math.floor(n/1000))+' ribu'+(n%1000?' '+idWords(n%1000):'');
}

// ---------------------------------------------------------------- UI helpers
function txt(scene,x,y,s,size,color='#24323d',o={}){
  return scene.add.text(x,y,s,{fontFamily:o.body?BODY:FONT,fontSize:size+'px',color,fontStyle:o.weight||'800',
    align:o.align||'center',wordWrap:o.wrap?{width:o.wrap,useAdvancedWrap:true}:undefined,lineSpacing:o.ls??2,
    stroke:o.stroke,strokeThickness:o.stroke?(o.st||6):0}).setOrigin(o.ox??0.5,o.oy??0.5).setPadding(4,6,4,6);
}
function btn(scene,x,y,w,h,color,label,cb,o={}){
  const c=scene.add.container(x,y);
  const g=scene.add.graphics();
  const dark=Phaser.Display.Color.ValueToColor(color).darken(o.white?6:20).color;
  const r=o.radius??Math.min(h/2,34);
  const t=txt(scene,0,0,label,o.size||30,o.textColor||'#ffffff');
  const draw=pr=>{g.clear();
    g.fillStyle(o.white?0xdfe7ec:dark,1).fillRoundedRect(-w/2,-h/2+8,w,h,r);
    g.fillStyle(color,1).fillRoundedRect(-w/2,-h/2+(pr?6:0),w,h,r);
    if(o.white) g.lineStyle(3,0xe1e8ed,1).strokeRoundedRect(-w/2,-h/2+(pr?6:0),w,h,r);
    t.y=pr?6:0; if(c.extra) c.extra.forEach(e=>e.y=e.baseY+(pr?6:0));};
  const z=scene.add.zone(0,4,w,h+8).setInteractive({useHandCursor:true});
  c.add([g,t,z]); c.label=t; c.extra=[]; draw(false);
  let pressed=false;
  z.on('pointerdown',()=>{pressed=true;draw(true)});
  z.on('pointerout',()=>{if(pressed){pressed=false;draw(false)}});
  z.on('pointerup',()=>{if(!pressed)return;pressed=false;draw(false);sfx.click();cb&&cb()});
  c.setEnabled=v=>{z.input.enabled=v;c.setAlpha(v?1:.45)};
  c.redraw=()=>draw(false);
  return c;
}
function panel(scene,x,y,w,h,fill=0xf3fbfe,stroke=null,r=28){
  const g=scene.add.graphics();
  g.fillStyle(fill,1).fillRoundedRect(x,y,w,h,r);
  if(stroke!==null) g.lineStyle(3,stroke,1).strokeRoundedRect(x,y,w,h,r);
  return g;
}
function drawBg(scene){
  scene.cameras.main.setBackgroundColor('#ffd59a');
  const g=scene.add.graphics();
  // floating bubbles
  for(let i=0;i<9;i++){const b=scene.add.circle(rnd(0,GW),rnd(0,GH),rnd(14,46),0xffffff,.28);
    scene.tweens.add({targets:b,y:'-=1400',duration:rnd(14000,24000),repeat:-1,onRepeat:()=>{b.y=GH+60;b.x=rnd(0,GW)}});}
  g.fillStyle(0xd99a52,1).fillRoundedRect(16,24,GW-32,GH-36,40);
  g.fillStyle(C.paper,1).fillRoundedRect(16,16,GW-32,GH-36,40);
  // notebook spine on top
  g.fillStyle(C.teal,1).fillRoundedRect(16,16,GW-32,52,{tl:40,tr:40,bl:0,br:0});
  g.fillStyle(C.yellow,1).fillRect(16,68,GW-32,10);
  for(let x=60;x<GW-40;x+=52){g.lineStyle(5,0x555555,1).strokeEllipse(x,40,14,30);}
}
function topBar(scene,title,o={}){
  const y=118;

}
function confetti(scene){
  const e=scene.add.particles(0,0,'conf',{speed:{min:300,max:750},angle:{min:200,max:340},gravityY:1100,lifespan:1800,
    scale:{start:1,end:.7},rotate:{min:0,max:360},tint:[0xff6a1a,0x4cc3e8,0xffd23f,0x2ec27e,0xff4d6d,0xb36bd6],emitting:false}).setDepth(100);
  return n=>e.explode(n,GW/2,GH*0.45);
}
function sheet(scene,{kind,emoji,title,body,btnLabel,onBtn}){
  const w=670,cx=GW/2;
  const col={good:[0xe3f8ee,0xb5ecd1,'#1b9b62'],bad:[0xffe9ee,0xffc4d0,'#d93355'],info:[0xf3fbfe,0xcdeefa,'#2f7f93']}[kind];
  const c=scene.add.container(cx,GH+20).setDepth(50);
  const tt=txt(scene,-w/2+118,24,title,32,col[2],{ox:0,oy:0,wrap:w-150,align:'left'});
  const bt=txt(scene,-w/2+118,24+tt.height+2,body,23,'#24323d',{body:true,weight:'700',ox:0,oy:0,wrap:w-150,align:'left',ls:4});
  let h=bt.y+bt.height+22; if(btnLabel) h+=104;
  const g=scene.add.graphics();
  g.fillStyle(0x000000,.08).fillRoundedRect(-w/2,8,w,h,30);
  g.fillStyle(col[0],1).fillRoundedRect(-w/2,0,w,h,30);g.lineStyle(4,col[1],1).strokeRoundedRect(-w/2,0,w,h,30);
  const em=txt(scene,-w/2+60,62,emoji,64);
  c.add([g,em,tt,bt]);
  if(btnLabel){const b=btn(scene,0,h-64,320,78,C.orange,btnLabel,onBtn,{size:32});c.add(b);}
  scene.tweens.add({targets:c,y:GH-30-h,duration:380,ease:'Back.Out'});
  c.sheetH=h;
  return c;
}

// ---------------------------------------------------------------- Abacus (soroban)
const AB={PAD:22,BW:112,BH:46,BEAM_TOP:130,BEAM_H:18,ROD_H:416,RW:140};
const H_ON=AB.BEAM_TOP-AB.BH-2, H_OFF=8, E_ACT0=AB.BEAM_TOP+AB.BEAM_H+2, E_FREE0=AB.ROD_H-8-4*AB.BH;
const yH=on=>AB.PAD+(on?H_ON:H_OFF);
const yE=(k,on)=>AB.PAD+(on?E_ACT0:E_FREE0)+k*AB.BH;
const BEAD_COLORS=[[0xff9bbb,0xe04877],[0xffdc6a,0xd99a00],[0x7fd4fb,0x1f93c9],[0x94e6a6,0x34a250]];

class Abacus{
  constructor(scene,cx,top,rods,opts={}){
    Object.assign(this,{s:scene,n:rods,opts,locked:false,fingers:0,drags:new Map(),busy:new Set(),dead:false});
    this.k=opts.scale||1;
    this.state=Array.from({length:rods},()=>({h:0,e:0}));
    const W=rods*AB.RW+2*AB.PAD, H=AB.PAD+AB.ROD_H+92;
    this.W=W; this.Hpx=(H+(opts.noHint?0:56))*this.k;
    const c=this.c=scene.add.container(cx-W*this.k/2,top).setScale(this.k);
    const g=scene.add.graphics();
    g.fillStyle(C.woodD,1).fillRoundedRect(0,10,W,H,30);
    g.fillStyle(C.wood,1).fillRoundedRect(0,0,W,H,30);
    g.fillStyle(0xc98450,1).fillRoundedRect(6,4,W-12,10,6);
    g.fillStyle(0xfff8ec,1).fillRoundedRect(AB.PAD-8,AB.PAD,W-2*AB.PAD+16,AB.ROD_H,16);
    c.add(g);
    this.glowG=scene.add.graphics(); c.add(this.glowG);
    const g2=scene.add.graphics(); c.add(g2);
    this.rodX=[];this.beads=[];this.digitT=[];this.placeT=[];
    for(let r=0;r<rods;r++){const x=AB.PAD+AB.RW*r+AB.RW/2;this.rodX.push(x);
      g2.fillStyle(0x9c9c9c,1).fillRect(x-5,AB.PAD+4,10,AB.ROD_H-8);g2.fillStyle(0xe6e6e6,1).fillRect(x-2,AB.PAD+4,3,AB.ROD_H-8);}
    g2.fillStyle(C.woodD,1).fillRect(AB.PAD-8,AB.PAD+AB.BEAM_TOP,W-2*AB.PAD+16,AB.BEAM_H);
    this.rodX.forEach(x=>g2.fillStyle(0xffe9b0,1).fillCircle(x,AB.PAD+AB.BEAM_TOP+AB.BEAM_H/2,4));
    for(let r=0;r<rods;r++){
      const x=this.rodX[r],place=rods-1-r,tex='bead'+(place%4);
      const mk=(kind,k)=>{const im=scene.add.image(x,0,tex).setOrigin(.5,0).setInteractive({useHandCursor:true});
        im.on('pointerdown',p=>this.grab(p,r,kind,k));c.add(im);return im;};
      const h=mk('h',0),e=[0,1,2,3].map(k=>mk('e',k));
      this.beads.push({h,e});
      const pt=txt(scene,x,AB.PAD+AB.ROD_H+30,L().places[place],22,'#ffffff');
      const dt=txt(scene,x,AB.PAD+AB.ROD_H+66,'0',34,'#ffe9b0');
      c.add([pt,dt]);this.placeT.push(pt);this.digitT.push(dt);
    }
    if(!opts.noHint){this.hintT=txt(scene,W/2,H+36,L().hint,20,'#7b8a95',{body:true,wrap:Math.max(W,560)});c.add(this.hintT);}
    this.toastT=txt(scene,W/2,-20,'',34,'#24323d',{stroke:'#ffd23f',st:12}).setAlpha(0);c.add(this.toastT);
    this.onMove=p=>this.move(p); this.onUp=p=>this.up(p);
    scene.input.on('pointermove',this.onMove);scene.input.on('pointerup',this.onUp);scene.input.on('pointerupoutside',this.onUp);
    scene.events.once('shutdown',()=>this.detach());
    this.update(true); this.resetTechnique();
  }
  detach(){this.s.input.off('pointermove',this.onMove);this.s.input.off('pointerup',this.onUp);this.s.input.off('pointerupoutside',this.onUp);}
  destroy(){if(this.dead)return;this.dead=true;this.detach();this.c.destroy();}
  localY(p){return (p.y-this.c.y)/this.k-AB.PAD}

  // ---- technique (pinch) tracking ----
  // A gesture lasts from the first finger down until the last finger lifts.
  // If one gesture moved BOTH the top and bottom beads on a rod, that rod was pinched.
  beginGesture(){if(this.fingers===0)this.gesture={};this.fingers++;}
  record(r,bit){this.gesture[r]=(this.gesture[r]||0)|bit;}
  endGesture(){
    this.fingers=Math.max(0,this.fingers-1); if(this.fingers>0) return;
    let pinched=false;
    for(const r in this.gesture) if(this.gesture[r]===3){this.pinched[r]=true;pinched=true;}
    if(pinched){sfx.pinch();this.toast(L().pinch);}
  }
  resetTechnique(){this.pinched={};this.fingers=0;this.gesture={};this.startState=this.state.map(s=>({...s}));}
  techniqueErrors(){ // place indexes where top+bottom both changed but not in one pinch
    const out=[];
    this.state.forEach((s,r)=>{const s0=this.startState[r];if(s.h!==s0.h&&s.e!==s0.e&&!this.pinched[r])out.push(this.n-1-r);});
    return out;
  }
  toast(t){this.s.tweens.killTweensOf(this.toastT);this.toastT.setText(t).setAlpha(1).setY(-20).setScale(.6);
    this.s.tweens.add({targets:this.toastT,scale:1.1,duration:200,ease:'Back.Out'});
    this.s.tweens.add({targets:this.toastT,y:-60,alpha:0,delay:700,duration:500});}

  // ---- dragging ----
  grab(p,r,kind,k){
    if(this.locked||this.drags.has(p.id)) return;
    const s=this.state[r],b=this.beads[r];
    let group,travel;
    if(kind==='h'){group=[b.h];travel=H_ON-H_OFF;}
    else if(k<s.e){group=b.e.slice(k,s.e);travel=E_FREE0-E_ACT0;}   // counted: pull it + the ones below it down
    else {group=b.e.slice(s.e,k+1);travel=E_FREE0-E_ACT0;}          // free: push it + the ones above it up
    const sign=kind==='h'?(s.h?-1:1):(k<s.e?1:-1);                     // allowed direction (+1 down)
    const pushingIn=(kind==='h'&&!s.h)||(kind==='e'&&k>=s.e);
    group.forEach(im=>{this.s.tweens.killTweensOf(im);this.busy.add(im);im.setScale(1.05);});
    this.beginGesture();
    this.drags.set(p.id,{touch:!!p.wasTouch,r,kind,k,group,travel,sign,pushingIn,bases:group.map(im=>im.y),y0:p.y,moved:0,crossH:false,crossK:-1,prev:new Set()});
  }
  preview(d,im,on,y){
    if(on){this.busy.add(im);d.prev.add(im);} else {d.prev.delete(im);}
    this.s.tweens.killTweensOf(im);
    this.s.tweens.add({targets:im,y,duration:130,ease:'Quad.Out'});
    im.setTint(on?0xfff6c0:0xffffff);
    if(!on) this.busy.add(im); // keep it out of update() until release
  }
  move(p){
    const d=this.drags.get(p.id); if(!d) return;
    const s=this.state[d.r],b=this.beads[d.r];
    d.moved=clamp((p.y-d.y0)/this.k*d.sign,0,d.travel);
    d.group.forEach((im,i)=>im.y=d.bases[i]+d.moved*d.sign);
    // One-pointer pinch shortcut is for MOUSE only (touch uses a real two-finger pinch),
    // and the pointer must travel deep past the bar so an ordinary push never triggers it.
    if(!d.pushingIn||d.touch) return;
    const rel=this.localY(p);
    if(d.kind==='e'&&!s.h){ // bottom bead pushed up ACROSS the bar -> bring the top bead down too
      const want=rel<H_OFF+AB.BH;            // up into the top bead's resting spot
      if(want!==d.crossH){d.crossH=want;this.preview(d,b.h,want,yH(want));}
    }
    if(d.kind==='h'&&s.e<4){ // top bead pulled down ACROSS the bar -> push bottom beads up to the one under the pointer
      let kk=-1;
      if(rel>E_FREE0) kk=Math.max(s.e,Math.min(3,Math.floor((rel-E_FREE0)/AB.BH))); // down among the free bottom beads
      if(kk!==d.crossK){d.crossK=kk;
        b.e.forEach((im,i)=>{if(i<s.e)return;const on=kk>=0&&i<=kk;this.preview(d,im,on,yE(i,on));});}
    }
  }
  up(p){
    const d=this.drags.get(p.id); if(!d) return; this.drags.delete(p.id);
    const s=this.state[d.r],b=this.beads[d.r];
    d.group.forEach(im=>{this.busy.delete(im);im.setScale(1);});
    [b.h,...b.e].forEach(im=>{if(!d.group.includes(im)&&this.busy.has(im)&&![...this.drags.values()].some(o=>o.group.includes(im))){this.busy.delete(im);}im.setTint(0xffffff);});
    const committed=d.moved>d.travel*0.35||d.crossH||d.crossK>=0;
    if(committed){
      if(d.kind==='h'){s.h^=1;this.record(d.r,1);} else {s.e=d.k<s.e?d.k:d.k+1;this.record(d.r,2);}
      if(d.crossH){s.h=1;this.record(d.r,1);}
      if(d.crossK>=0){s.e=d.crossK+1;this.record(d.r,2);}
      sfx.clack();
    }
    this.update(); this.endGesture();
    if(committed&&this.opts.onChange) this.opts.onChange(this.value());
  }
  update(instant){
    for(let r=0;r<this.n;r++){
      const s=this.state[r],b=this.beads[r];
      const go=(im,y)=>{if(this.busy.has(im))return;this.s.tweens.killTweensOf(im);
        if(instant){im.y=y;return;} if(Math.abs(im.y-y)<.5)return;
        this.s.tweens.add({targets:im,y,duration:180,ease:'Back.Out'});};
      go(b.h,yH(s.h));b.e.forEach((im,k)=>go(im,yE(k,k<s.e)));
      this.digitT[r].setText(this.opts.hideDigits?'?':String(s.h*5+s.e));
    }
    this.glowG.clear();
    (this.opts.glow||[]).forEach(place=>{const r=this.n-1-place;if(r<0)return;const x=this.rodX[r];
      this.glowG.fillStyle(C.yellow,.4).fillRoundedRect(x-AB.RW/2+10,AB.PAD+4,AB.RW-20,AB.ROD_H-8,14);});
  }
  value(){return this.state.reduce((a,s)=>a*10+s.h*5+s.e,0)}
  set(n,instant){const s=String(n).padStart(this.n,'0').slice(-this.n);
    this.state=[...s].map(c=>{const d=+c;return{h:d>=5?1:0,e:d%5}});this.update(instant);this.resetTechnique();}
  animateTo(n,cb){const s=String(n).padStart(this.n,'0');let r=0;
    const step=()=>{if(this.dead)return;if(r>=this.n){this.resetTechnique();cb&&cb();return;}
      const d=+s[r];this.state[r]={h:d>=5?1:0,e:d%5};this.update();sfx.clack();r++;this.s.time.delayedCall(380,step);};
    step();}
  demo(n){ // show a pinch: all beads of each rod move at the same time
    if(this.demoing) return; this.demoing=true;
    const saved=this.state.map(s=>({...s})),wasLocked=this.locked; this.locked=true;
    this.state=[...String(n).padStart(this.n,'0')].map(c=>{const d=+c;return{h:d>=5?1:0,e:d%5}});
    this.update();sfx.clack();this.toast(L().pinch);sfx.pinch();
    this.s.time.delayedCall(1500,()=>{if(this.dead)return;this.state=saved;this.update();this.locked=wasLocked;this.demoing=false;this.resetTechnique();});
  }
  reveal(){this.opts.hideDigits=false;this.update();}
  lock(v){this.locked=v;if(this.hintT)this.hintT.setVisible(!v);}
}

function explain(n,rods){
  const s=String(n).padStart(rods,'0'),out=[];
  for(let k=0;k<rods;k++){const d=+s[k];out.push(`${L().places[rods-1-k]} ${d} → ${L().digit(d)}`);}
  return out.join('\n');
}
const placeNames=list=>list.map(p=>L().places[p]).join(L().and);

class Boot extends Phaser.Scene{
  constructor(){super('Boot')}
  create(){
    BEAD_COLORS.forEach(([light,dark],i)=>{
      const g=this.make.graphics({x:0,y:0,add:false}),w=AB.BW,h=AB.BH;
      const P=a=>a.map(([x,y])=>({x,y}));
      g.fillStyle(dark,1).fillPoints(P([[w*.2,1],[w*.8,1],[w-1,h/2],[w*.8,h-1],[w*.2,h-1],[1,h/2]]),true);
      g.fillStyle(light,1).fillPoints(P([[w*.2,1],[w*.8,1],[w-1,h/2],[1,h/2]]),true);
      g.fillStyle(0xffffff,.5).fillEllipse(w/2,h*.2,w*.5,h*.16);
      g.lineStyle(2,Phaser.Display.Color.ValueToColor(dark).darken(15).color,1).strokePoints(P([[w*.2,1],[w*.8,1],[w-1,h/2],[w*.8,h-1],[w*.2,h-1],[1,h/2]]),true);
      g.generateTexture('bead'+i,w,h);g.destroy();
    });
    const g=this.make.graphics({add:false});g.fillStyle(0xffffff,1).fillRect(0,0,14,9);g.generateTexture('conf',14,9);g.destroy();
    const img=new Image();
    const go=()=>{const el=document.getElementById('loading');if(el)el.remove();this.scene.start('Home');};
    img.onload=()=>{this.textures.addImage('kid',img);go();};
    img.onerror=go;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(kidSVG());
  }
}

    if(this.textures.exists('kid')){
      const kid=this.add.image(200,382,'kid').setScale(.46);

      const t=txt(this,410+k*92,260,ch,128,col,{stroke:'#ffffff',st:16}).setAngle(ang);
      t.setShadow(4,6,'rgba(0,0,0,.25)',0,true,true);
      this.tweens.add({targets:t,y:244,yoyo:true,repeat:-1,duration:700,delay:k*180,ease:'Sine.InOut'});
    });
    const bw=330,bx=505,by=388;
    const ban=this.add.graphics();
    ban.fillStyle(0x1565c0,1).fillRoundedRect(bx-bw/2,by-38+6,bw,76,22);
    ban.fillStyle(0x1e88e5,1).fillRoundedRect(bx-bw/2,by-38,bw,76,22);
    txt(this,bx,by,'SEMPOA',58,'#ffffff',{stroke:'#0d47a1',st:8});
    txt(this,GW/2,560,T.tagline,24,'#5b6b77',{body:true,weight:'700'});
    const card=(y,color,emoji,t,sub,cb)=>{
      const b=btn(this,GW/2,y,600,160,color,'',cb,{radius:36});
      const e=txt(this,-220,0,emoji,74); const a=txt(this,-140,-28,t,46,'#ffffff',{ox:0}); const s=txt(this,-140,30,sub,21,'#ffffff',{ox:0,body:true,weight:'700',wrap:400,align:'left'});
      [e,a,s].forEach(o=>{o.baseY=o.y;}); b.add([e,a,s]); b.extra=[e,a,s];
      b.setScale(0); this.tweens.add({targets:b,scale:1,duration:450,delay:(y-700)/1.4,ease:'Back.Out'});
    };
    card(700,C.blue,'📚',T.learn,T.learnSub,()=>this.scene.start('Learn',{i:0}));

    if(best) txt(this,GW/2,1200,T.best(best),24,'#8c99a3',{body:true});
  }
}

class Learn extends Phaser.Scene{
  constructor(){super('Learn')}

// ---------------------------------------------------------------- CHALLENGE
const PLAN=[['build',1,9],['read',1,9],['build',2,99],['add',2,0],['read',2,99],['sub',2,0],['build',2,99],['read',3,999],['add',3,0],['build',3,999]];
// Keep add/take-away rounds to moves the pinch supports: adding may need a pinch-in
// (top + bottom beads toward the bar). No "mixed" 5-complement moves in this prototype.
function badMove(a,b,rods,allowPinchIn){
  const A=String(a).padStart(rods,'0'),B=String(b).padStart(rods,'0');
  for(let k=0;k<rods;k++){const x=+A[k],y=+B[k];const dh=(y>=5)-(x>=5),de=(y%5)-(x%5);
    if(dh&&de){if(dh*de<0)return true;if(!(allowPinchIn&&dh>0))return true;}}
  return false;
}
function makeRound([type,rods,max]){
  for(let t=0;t<500;t++){
    const R={type,rods};
    if(type==='build'){R.target=rnd(rods===1?1:10,max);R.start=0;return R;}
    if(type==='read'){R.target=rnd(rods===1?1:10**(rods-1),max);
      const c=new Set([R.target]),s=String(R.target);
      for(const x of shuffle([+[...s].reverse().join(''),R.target+5,R.target-5,R.target+10,R.target-10,R.target+1,R.target-1,R.target+50,R.target-50,R.target+100])){if(c.size>=4)break;if(x>0&&x<10**rods)c.add(x);}
      while(c.size<4)c.add(rnd(1,10**rods-1));R.options=shuffle([...c]);return R;}
    if(type==='add'){const a=rnd(rods===2?11:110,rods===2?60:500),b=rnd(rods===2?3:20,rods===2?35:400);
      Object.assign(R,{start:a,delta:b,target:a+b});if(R.target<10**rods&&!badMove(a,R.target,rods,true))return R;}
    if(type==='sub'){const a=rnd(rods===2?30:300,rods===2?99:999),b=rnd(2,Math.min(40,a-5));
      Object.assign(R,{start:a,delta:b,target:a-b});if(!badMove(a,R.target,rods,false))return R;}
  }
  return {type:'build',rods,target:rnd(1,9),start:0};
}
const TYPE_COL={build:C.orange,read:C.blue,add:C.green,sub:C.purple};
const TIME=30;

class Challenge extends Phaser.Scene{
  constructor(){super('Challenge')}
  create(){
    drawBg(this); const T=L();
    btn(this,82,118,110,62,0xffffff,'🏠',()=>this.scene.start('Home'),{white:true,size:30,textColor:'#24323d'});
    panel(this,170,90,200,58,0xffffff,C.line,29); this.scoreT=txt(this,270,119,'⭐ 0',28,'#24323d');
    panel(this,385,90,160,58,0xffffff,0xffd0b5,29); this.comboT=txt(this,465,119,'🔥 x1',28,'#e0520a');
    const mb=btn(this,GW-72,118,90,62,0xffffff,muted?'🔇':'🔊',()=>{muted=!muted;store.set('sempoaMute',muted?'1':'0');mb.label.setText(muted?'🔇':'🔊')},{white:true,size:28,textColor:'#24323d'});
    this.burst=confetti(this);
    this.progG=this.add.graphics(); this.timerG=this.add.graphics();
    this.rounds=PLAN.map(makeRound); this.ri=0; this.score=0; this.combo=1; this.streak=0; this.best=0; this.correct=0; this.results=[];
    this.objs=[]; this.load();
  }
  drawProgress(){
    const g=this.progG;g.clear();const w=(GW-120-9*8)/10;
    this.rounds.forEach((_,k)=>{const r=this.results[k];const col=r?(r.ok?C.green:C.red):k===this.ri?C.yellow:C.line;
      g.fillStyle(col,1).fillRoundedRect(60+k*(w+8),170,w,14,7);});
  }
  clear(){this.objs.forEach(o=>o.destroy());this.objs=[];if(this.ab){this.ab.destroy();this.ab=null;}if(this.sh){this.sh.destroy();this.sh=null;}}
  load(){
    this.clear(); const R=this.rounds[this.ri],T=L(); this.answered=false;
    this.drawProgress();
    const o=this.objs;
    o.push(txt(this,60,228,T.round(this.ri+1),34,'#4cc3e8',{ox:0}));
    const bw=230; const bg=panel(this,GW-60-bw,206,bw,46,TYPE_COL[R.type],null,23); o.push(bg);
    o.push(txt(this,GW-60-bw/2,229,T.types[R.type],24,'#ffffff'));
    // instruction
    let ins;
    if(R.type==='build') ins=T.instrBuild(R.target);
    if(R.type==='read') ins=T.instrRead;
    if(R.type==='add') ins=T.instrAdd(R.start,R.delta);
    if(R.type==='sub') ins=T.instrSub(R.start,R.delta);
    const it=txt(this,GW/2,R.type==='read'?330:340,ins,R.type==='build'?32:30,'#24323d',{wrap:620});
    o.push(it);
    if(R.type==='build'){ // make the number pop
      const lines=ins.split('\n');it.setText(lines[0]);it.y=310;
      const big=txt(this,GW/2,370,lines[1],76,'#ff6a1a',{stroke:'#ffffff',st:8});o.push(big);
      this.tweens.add({targets:big,scale:{from:.4,to:1},duration:400,ease:'Back.Out'});
    }
    const scale=R.rods===1?.92:.9;
    this.ab=new Abacus(this,GW/2,440,R.rods,{scale,hideDigits:true,noHint:R.type==='read'});
    if(R.type==='read'){
      this.ab.set(R.target,true);this.ab.lock(true);
      R.options.forEach((v,k)=>{const cols=[C.blue,C.purple,C.green,0xff8c42];
        const b=btn(this,GW/2+(k%2?165:-165),1010+Math.floor(k/2)*120,300,96,cols[k],String(v),()=>this.submit(v,[],b),{size:46});
        b.val=v;o.push(b);});
    } else {
      this.ab.set(R.start||0,true);
      o.push(btn(this,200,1060,260,86,0xffffff,T.clear,()=>{if(!this.answered)this.ab.set(R.start||0)},{white:true,textColor:'#2f7f93',size:30}));
      o.push(btn(this,500,1060,300,86,C.orange,T.check,()=>{if(!this.answered)this.submit(this.ab.value(),this.ab.techniqueErrors())},{size:32}));
    }
    this.t0=this.time.now;
  }
  update(){
    const g=this.timerG;g.clear();if(!this.rounds)return;
    const left=this.answered?this.leftFrac:clamp(1-(this.time.now-this.t0)/(TIME*1000),0,1);
    g.fillStyle(C.line,1).fillRoundedRect(60,270,GW-120,12,6);
    const col=left>.5?C.green:left>.2?C.yellow:C.orange;
    if(left>0) g.fillStyle(col,1).fillRoundedRect(60,270,(GW-120)*left,12,6);
  }
  submit(given,errs,pickedBtn){
    if(this.answered) return; this.answered=true;
    this.leftFrac=clamp(1-(this.time.now-this.t0)/(TIME*1000),0,1);
    const R=this.rounds[this.ri],T=L(),rightNum=given===R.target,ok=rightNum&&!errs.length;
    this.ab.lock(true); this.ab.reveal();
    if(R.type==='read') this.objs.filter(b=>b.val!==undefined).forEach(b=>{b.setEnabled(false);
      if(b.val===R.target){b.setAlpha(1);this.tweens.add({targets:b,scale:1.08,yoyo:true,repeat:2,duration:150});}
      else if(b===pickedBtn){b.setAlpha(1);b.label.setText('✖ '+b.val);}});
    let how=explain(R.target,R.rods);
    if(R.type==='add') how=`${R.start} + ${R.delta} = ${R.target}\n`+how;
    if(R.type==='sub') how=`${R.start} − ${R.delta} = ${R.target}\n`+how;
    let kind,emoji,title;
    if(ok){
      this.correct++;this.streak++;this.best=Math.max(this.best,this.streak);
      const gained=(100+Math.round(TIME*this.leftFrac*3))*this.combo;this.score+=gained;this.combo=Math.min(5,this.combo+1);
      kind='good';emoji=pickOne(['🥳','😎','🤩','🦄']);title=pickOne(T.praise)+`  +${gained}`;
      sfx.good();this.burst(60);
      const f=txt(this,GW/2,430,'+'+gained,60,'#2ec27e',{stroke:'#ffffff',st:8}).setDepth(60);
      this.tweens.add({targets:f,y:340,alpha:0,duration:1000,onComplete:()=>f.destroy()});
    } else {
      this.streak=0;this.combo=1;kind='bad';emoji='🤔';
      title=rightNum?T.noPinchT:`${pickOne(T.cheer)} ${T.answerIs(R.target)}`;
      if(rightNum) how=T.noPinchB(placeNames(errs))+'\n'+how;
      sfx.bad();this.cameras.main.shake(220,.006);
      if(R.type!=='read'&&!rightNum) this.time.delayedCall(500,()=>this.ab&&this.ab.animateTo(R.target));
    }
    this.results.push({R,ok,given,noPinch:rightNum&&!ok});
    this.scoreT.setText('⭐ '+this.score);this.comboT.setText('🔥 x'+this.combo);this.drawProgress();
    const last=this.ri===this.rounds.length-1;
    this.sh=sheet(this,{kind,emoji,title,body:how,btnLabel:last?'🏆':T.next,onBtn:()=>{
      if(last){
        const b=+store.get('sempoaBest','0');if(this.score>b)store.set('sempoaBest',String(this.score));
        this.scene.start('Result',{score:this.score,correct:this.correct,best:this.best,results:this.results});
      } else {this.ri++;this.load();}
    }});
  }
}
