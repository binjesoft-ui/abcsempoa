const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ---------------------------------------------------------------- sound
let actx=null, muted=store.get('sempoaMute','0')==='1';
function tone(f,d,type='triangle',delay=0,vol=.14){ if(muted) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){} }
const sfx={
  clack:()=>{tone(1200,.04,'square',0,.05);tone(500,.06,'triangle',.01,.08)},
  click:()=>tone(660,.08),
  ding:()=>{tone(988,.1,'sine',0,.1);tone(1319,.14,'sine',.07,.08)},
  good:()=>{tone(523,.12);tone(659,.12,'triangle',.1);tone(784,.2,'triangle',.2)},
  bad:()=>{tone(220,.2,'sawtooth',0,.08);tone(160,.3,'sawtooth',.15,.08)},
  pinch:()=>{tone(880,.1,'sine',0,.1);tone(1320,.15,'sine',.06,.1)},
  star:k=>tone(700+k*200,.2),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.12))
};

// ---------------------------------------------------------------- language
let LANG=store.get('sempoaLang','id');
const EN_ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN_TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function enWords(n){
  if(n<20) return EN_ONES[n];
  if(n<100) return EN_TENS[Math.floor(n/10)]+(n%10?'-'+EN_ONES[n%10]:'');
  if(n<1000) return EN_ONES[Math.floor(n/100)]+' hundred'+(n%100?' and '+enWords(n%100):'');
  if(n<1e6) return enWords(Math.floor(n/1000))+' thousand'+(n%1000?(n%1000<100?' and ':' ')+enWords(n%1000):'');
  if(n<1e9) return enWords(Math.floor(n/1e6))+' million'+(n%1e6?(n%1e6<100?' and ':' ')+enWords(n%1e6):'');
  return enWords(Math.floor(n/1e9))+' billion'+(n%1e9?(n%1e9<100?' and ':' ')+enWords(n%1e9):'');
}
const ID_S=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function idWords(n){
  if(n<12) return ID_S[n];
  if(n<20) return ID_S[n-10]+' belas';
  if(n<100) return ID_S[Math.floor(n/10)]+' puluh'+(n%10?' '+ID_S[n%10]:'');
  if(n<200) return 'seratus'+(n%100?' '+idWords(n%100):'');
  if(n<1000) return ID_S[Math.floor(n/100)]+' ratus'+(n%100?' '+idWords(n%100):'');
  if(n<2000) return 'seribu'+(n%1000?' '+idWords(n%1000):'');
  if(n<1e6) return idWords(Math.floor(n/1000))+' ribu'+(n%1000?' '+idWords(n%1000):'');
  if(n<1e9) return idWords(Math.floor(n/1e6))+' juta'+(n%1e6?' '+idWords(n%1e6):'');
  return idWords(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+idWords(n%1e9):'');
}

// place names: 0 = ones; 1 = tens; ...; -1 = tenths ...
function placeName(p){
  const T=L();
  if(p>=0) return T.placesFull[p]||('10^'+p);
  return T.placesDec[-p-1]||('10^'+p);
}

function btn(scene,x,y,w,h,color,label,cb,o={}){
  const c=scene.add.container(x,y);
  const g=scene.add.graphics();
  const dark=Phaser.Display.Color.ValueToColor(color).darken(o.white?6:20).color;
  const r=o.radius??Math.min(h/2,30);
  const t=txt(scene,0,0,label,o.size||28,o.textColor||'#ffffff');
  const draw=pr=>{g.clear();
    g.fillStyle(o.white?0xdfe7ec:dark,1).fillRoundedRect(-w/2,-h/2+7,w,h,r);
    g.fillStyle(color,1).fillRoundedRect(-w/2,-h/2+(pr?5:0),w,h,r);
    if(o.white) g.lineStyle(3,0xe1e8ed,1).strokeRoundedRect(-w/2,-h/2+(pr?5:0),w,h,r);
    t.y=pr?5:0; if(c.extra) c.extra.forEach(e=>e.y=e.baseY+(pr?5:0));};
  const z=scene.add.zone(0,3,w,h+7).setInteractive({useHandCursor:true});
  c.add([g,t,z]); c.label=t; c.extra=[]; draw(false);
  let pressed=false,fired=false;
  z.on('pointerdown',()=>{pressed=true;draw(true)});
  z.on('pointerout',()=>{if(pressed){pressed=false;draw(false)}});
  z.on('pointerup',()=>{if(!pressed)return;pressed=false;draw(false);
    if(o.once){if(fired)return;fired=true;}
    sfx.click();
    // run the action on the next tick, after Phaser has finished handling this tap
    if(cb) scene.time.delayedCall(0,()=>{ if(scene.sys.isActive()) cb(); });
  });
  c.setEnabled=v=>{z.input.enabled=v;c.setAlpha(v?1:.45)};
  return c;
}

// ---------------------------------------------------------------- Abacus (soroban)
// Geometry in local (unscaled) units. Beads 120 x 48 on rods 132 apart.
const AB={PAD:18,BW:120,BH:48,BEAM_H:16,RW:132,TRAVEL:66};
const H_OFF=6, H_ON=H_OFF+AB.TRAVEL;
AB.BEAM_TOP=H_ON+AB.BH+2;
const E_ACT0=AB.BEAM_TOP+AB.BEAM_H+2, E_FREE0=E_ACT0+AB.TRAVEL;
AB.ROD_H=E_FREE0+4*AB.BH+6;
const LABEL_H={full:80,digits:48,none:0};
const abHeight=(labels='full')=>AB.PAD*2+AB.ROD_H+LABEL_H[labels];   // unscaled frame height
const PINCH_GRACE=450; // ms: top + bottom moves this close together still count as one pinch
let BEADS=store.get('sempoaBeads','color');               // 'color' | 'brown'
const yH=on=>AB.PAD+(on?H_ON:H_OFF);
const yE=(k,on)=>AB.PAD+(on?E_ACT0:E_FREE0)+k*AB.BH;
const BEAD_COLORS=[[0xff9bbb,0xe04877],[0xffdc6a,0xd99a00],[0x7fd4fb,0x1f93c9],[0x94e6a6,0x34a250]];
const BEAD_BROWN=[0xd8a06a,0x7a4520];

/* opts: scale, unit (index of the ones rod from the left; default = last rod),
         labels 'full'|'digits'|'none', viewW (visible width in px; wider sempoa scrolls with a slider),
         glow [places], hideDigits, onChange(value) */
class Abacus{
  constructor(scene,cx,top,rods,opts={}){
    Object.assign(this,{s:scene,n:rods,opts,locked:false,fingers:0,drags:new Map(),busy:new Set(),dead:false,extras:[]});
    this.k=opts.scale||1; this.u=opts.unit??(rods-1); this.labels=opts.labels||'full'; this.top=top; this.cx=cx;
    this.state=Array.from({length:rods},()=>({h:0,e:0}));
    const W=rods*AB.RW+2*AB.PAD, H=abHeight(this.labels), k=this.k;
    this.W=W; this.Hpx=H*k;
    const fullW=W*k; this.fullW=fullW;
    this.viewW=opts.viewW&&opts.viewW<fullW?opts.viewW:fullW;
    this.scrolls=this.viewW<fullW;
    this.vx0=cx-this.viewW/2; this.scrollX=0; this.maxScroll=fullW-this.viewW;
    this.totalH=this.Hpx+(this.scrolls?66:0);
    const c=this.c=scene.add.container(this.vx0,top).setScale(k);
    // frame
    const g=scene.add.graphics();
    g.fillStyle(C.woodD,1).fillRoundedRect(0,8,W,H,24);
    g.fillStyle(C.wood,1).fillRoundedRect(0,0,W,H,24);
    g.fillStyle(0xc98450,1).fillRoundedRect(6,4,W-12,8,5);
    g.fillStyle(0xfff8ec,1).fillRoundedRect(AB.PAD-6,AB.PAD,W-2*AB.PAD+12,AB.ROD_H,12);
    c.add(g);
    this.glowG=scene.add.graphics(); c.add(this.glowG);
    const g2=scene.add.graphics(); c.add(g2);
    this.rodX=[];this.beads=[];this.digitT=[];
    for(let r=0;r<rods;r++){const x=AB.PAD+AB.RW*r+AB.RW/2;this.rodX.push(x);
      g2.fillStyle(0x9c9c9c,1).fillRect(x-4,AB.PAD+4,8,AB.ROD_H-8);g2.fillStyle(0xe6e6e6,1).fillRect(x-1.5,AB.PAD+4,3,AB.ROD_H-8);}
    const beamY=AB.PAD+AB.BEAM_TOP;
    g2.fillStyle(C.woodD,1).fillRect(AB.PAD-6,beamY,W-2*AB.PAD+12,AB.BEAM_H);
    // unit dots: every 3rd rod counted from the ones rod; the ones rod gets a bigger orange dot + ▼ marker
    for(let r=0;r<rods;r++){const x=this.rodX[r],d=this.u-r;
      if(d===0){g2.fillStyle(0x3a2416,1).fillCircle(x,beamY+AB.BEAM_H/2,9);g2.fillStyle(0xffb547,1).fillCircle(x,beamY+AB.BEAM_H/2,7);}
      else if(d%3===0){g2.fillStyle(0x3a2416,1).fillCircle(x,beamY+AB.BEAM_H/2,7);g2.fillStyle(0xffffff,1).fillCircle(x,beamY+AB.BEAM_H/2,5);}}
    if(rods>3){const x=this.rodX[this.u];
      g2.fillStyle(0xffb547,1).fillTriangle(x-20,-4,x+20,-4,x,16);g2.lineStyle(2,0x3a2416,1).strokeTriangle(x-20,-4,x+20,-4,x,16);}
    for(let r=0;r<rods;r++){
      const x=this.rodX[r],place=this.u-r,tex=BEADS==='brown'?'beadBrown':'bead'+(((place%4)+4)%4);
      const mk=()=>{const im=scene.add.image(x,0,tex).setOrigin(.5,0);c.add(im);return im;};
      const h=mk(),e=[0,1,2,3].map(mk);
      this.beads.push({h,e});
      // big invisible touch zones: above the bar grabs the top bead, below grabs the nearest bottom bead
      const zH=scene.add.zone(x,AB.PAD+AB.BEAM_TOP/2,AB.RW,AB.BEAM_TOP).setInteractive({useHandCursor:true});
      zH.on('pointerdown',p=>this.grab(p,r,'h',0));
      const eTop=AB.PAD+AB.BEAM_TOP+AB.BEAM_H, eH=AB.ROD_H-AB.BEAM_TOP-AB.BEAM_H;
      const zE=scene.add.zone(x,eTop+eH/2,AB.RW,eH).setInteractive({useHandCursor:true});
      zE.on('pointerdown',p=>this.grab(p,r,'e',this.nearestEarth(r,p)));
      c.add([zH,zE]);
      if(this.labels==='full'){
        c.add(txt(scene,x,AB.PAD+AB.ROD_H+30,placeName(place),20,'#ffffff'));
        const dt=txt(scene,x,AB.PAD+AB.ROD_H+64,'0',32,'#ffe9b0');c.add(dt);this.digitT.push(dt);
      } else if(this.labels==='digits'){
        const dt=txt(scene,x,AB.PAD+AB.ROD_H+30,'0',28,'#ffe9b0');c.add(dt);this.digitT.push(dt);
      }
    }
    // demonstration fingers (index finger + thumb)
    this.fIndex=txt(scene,0,0,'👇',52).setAlpha(0); this.fThumb=txt(scene,0,0,'👆',52).setAlpha(0);
    c.add([this.fIndex,this.fThumb]);
    this.baseGlow=(opts.glow||[]).slice();
    // "Jepit!" toast floats above the visible part of the sempoa
    this.toastT=txt(scene,cx,top-8,'',30,'#24323d',{stroke:'#ffd23f',st:10}).setAlpha(0).setDepth(70);this.extras.push(this.toastT);
    if(this.scrolls) this.buildScroller();
    this.onMove=p=>this.move(p); this.onUp=p=>this.up(p);
    scene.input.on('pointermove',this.onMove);scene.input.on('pointerup',this.onUp);scene.input.on('pointerupoutside',this.onUp);
    scene.events.once('shutdown',()=>this.detach());
    if(this.scrolls) this.setScroll((AB.PAD+AB.RW*this.u+AB.RW/2)*k-this.viewW*0.72);
    this.update(true); this.resetTechnique();
  }
  // ---------- scrolling (full sempoa) ----------
  buildScroller(){
    const s=this.s,top=this.top;
    const mg=s.make.graphics({add:false}); mg.fillStyle(0xffffff).fillRect(this.vx0,top-40,this.viewW,this.Hpx+60);
    this.c.setMask(mg.createGeometryMask()); this.maskG=mg;
    const sy=top+this.Hpx+36, sw=Math.min(this.viewW*0.7,520), sx0=this.cx-sw/2;
    this.sl={sy,sw,sx0};
    const tg=s.add.graphics(); this.extras.push(tg);
    tg.fillStyle(0x24323d,.07).fillRoundedRect(sx0-18,sy-22,sw+36,44,22);
    for(let r=0;r<this.n;r++){const x=sx0+(r+.5)/this.n*sw;
      if(r===this.u){tg.fillStyle(0xffb547,1).fillCircle(x,sy,6);} else tg.fillStyle(0x9aa5ad,1).fillRect(x-1.5,sy-8,3,16);}
    this.handleG=s.add.graphics(); this.extras.push(this.handleG);
    const z=s.add.zone(this.cx,sy,sw+40,52).setInteractive({useHandCursor:true}); this.extras.push(z);
    z.on('pointerdown',p=>{this.sliding=p.id;this.slideTo(p.x);});
    // the edges of the sempoa frame also show little arrows you can tap
    const arrow=(x,dir)=>{const b=btn(s,x,top+this.Hpx/2,40,90,0xffffff,dir<0?'‹':'›',()=>this.scrollBy(dir*AB.RW*this.k*2),{white:true,size:40,textColor:'#7a4520',radius:16});this.extras.push(b);return b;};
    this.arrL=arrow(this.vx0-26,-1); this.arrR=arrow(this.vx0+this.viewW+26,1);
  }
  slideTo(px){const {sx0,sw}=this.sl;this.setScroll((px-sx0)/sw*this.fullW-this.viewW/2);}
  setScroll(v){
    if(!this.scrolls) return;
    this.scrollX=clamp(v,0,this.maxScroll); this.c.x=this.vx0-this.scrollX;
    const {sx0,sw,sy}=this.sl,g=this.handleG,hx=sx0+this.scrollX/this.fullW*sw,hw=this.viewW/this.fullW*sw;
    g.clear(); g.fillStyle(0xffffff,1).fillRoundedRect(hx,sy-16,hw,32,16); g.lineStyle(3,0xd99a52,1).strokeRoundedRect(hx,sy-16,hw,32,16);
    g.fillStyle(0xd99a52,1).fillCircle(hx+hw/2,sy,4);
    if(this.arrL){this.arrL.setAlpha(this.scrollX>1?1:.35);this.arrR.setAlpha(this.scrollX<this.maxScroll-1?1:.35);}
  }
  scrollBy(dx){this.tweenScroll(this.scrollX+dx);}
  tweenScroll(to){ if(!this.scrolls) return;
    this.s.tweens.addCounter({from:this.scrollX,to:clamp(to,0,this.maxScroll),duration:320,ease:'Sine.InOut',onUpdate:t=>this.setScroll(t.getValue())});}
  scrollToRod(r){ if(!this.scrolls) return;
    const x=(AB.PAD+AB.RW*r+AB.RW/2)*this.k-this.scrollX, m=AB.RW*this.k;
    if(x<m||x>this.viewW-m) this.tweenScroll((AB.PAD+AB.RW*r+AB.RW/2)*this.k-this.viewW/2);}
  inView(p){return !this.scrolls||(p.x>=this.vx0&&p.x<=this.vx0+this.viewW);}

  detach(){this.s.input.off('pointermove',this.onMove);this.s.input.off('pointerup',this.onUp);this.s.input.off('pointerupoutside',this.onUp);}
  destroy(){if(this.dead)return;this.dead=true;this.detach();this.extras.forEach(o=>o.destroy());if(this.maskG)this.maskG.destroy();this.c.destroy();}
  localY(p){return (p.y-this.c.y)/this.k-AB.PAD}
  nearestEarth(r,p){
    const ly=(p.y-this.c.y)/this.k;let best=0,bd=1e9;
    this.beads[r].e.forEach((im,k)=>{const d=Math.abs(ly-(im.y+AB.BH/2));if(d<bd){bd=d;best=k;}});
    return best;
  }
  dig(r){const s=this.state[r];return s.h*5+s.e;}
  // digit for every rod when the integer n sits with its ones digit on the unit rod
  digitsFor(n){const s=String(Math.max(0,Math.floor(n))),a=Array(this.n).fill(0);
    for(let i=0;i<s.length;i++){const r=this.u-(s.length-1-i);if(r>=0)a[r]=+s[i];}return a;}

  // ---- technique (pinch) tracking ----
  beginGesture(){
    if(this.fingers===0){ if(this.graceT){this.graceT.remove(false);this.graceT=null;} else this.gesture={}; }
    this.fingers++;
  }
  record(r,bit){
    const was=this.gesture[r]||0; this.gesture[r]=was|bit;
    if(was!==3&&this.gesture[r]===3){this.pinched[r]=true;sfx.pinch();this.toast(L().pinch);}
  }
  endGesture(){
    this.fingers=Math.max(0,this.fingers-1); if(this.fingers>0) return;
    if(this.graceT) this.graceT.remove(false);
    this.graceT=this.s.time.delayedCall(PINCH_GRACE,()=>{this.graceT=null;this.gesture={};});
  }
  resetTechnique(){
    if(this.graceT){this.graceT.remove(false);this.graceT=null;}
    this.pinched={};this.fingers=this.drags?this.drags.size:0;this.gesture={};this.startState=this.state.map(s=>({...s}));
  }
  techniqueErrors(){ // places where top+bottom both changed but not in one pinch
    const out=[];
    this.state.forEach((s,r)=>{const s0=this.startState[r];if(s.h!==s0.h&&s.e!==s0.e&&!this.pinched[r])out.push(this.u-r);});
    return out;
  }
  toast(t){this.s.tweens.killTweensOf(this.toastT);this.toastT.setText(t).setAlpha(1).setY(this.top-8).setScale(.6);
    this.s.tweens.add({targets:this.toastT,scale:1.1,duration:200,ease:'Back.Out'});
    this.s.tweens.add({targets:this.toastT,y:this.top-40,alpha:0,delay:700,duration:500});}

  // ---- dragging ----
  grab(p,r,kind,k){
    if(this.locked||this.drags.has(p.id)||!this.inView(p)) return;
    const s=this.state[r],b=this.beads[r];
    let group,travel;
    if(kind==='h'){group=[b.h];travel=H_ON-H_OFF;}
    else if(k<s.e){group=b.e.slice(k,s.e);travel=E_FREE0-E_ACT0;}   // counted: pull it + the ones below it down
    else {group=b.e.slice(s.e,k+1);travel=E_FREE0-E_ACT0;}          // free: push it + the ones above it up
    const sign=kind==='h'?(s.h?-1:1):(k<s.e?1:-1);                     // allowed direction (+1 down)
    const pushingIn=(kind==='h'&&!s.h)||(kind==='e'&&k>=s.e);
    group.forEach(im=>{this.s.tweens.killTweensOf(im);this.busy.add(im);im.setScale(1.05);});
    this.beginGesture();
    this.drags.set(p.id,{touch:!!p.wasTouch,r,kind,k,group,travel,sign,pushingIn,bases:group.map(im=>im.y),y0:p.y,moved:0,crossH:false,crossK:-1,prev:new Set()});
  }
  preview(d,im,on,y){
    if(on){this.busy.add(im);d.prev.add(im);} else {d.prev.delete(im);}
    this.s.tweens.killTweensOf(im);
    this.s.tweens.add({targets:im,y,duration:130,ease:'Quad.Out'});
    im.setTint(on?0xfff6c0:0xffffff);
    if(!on) this.busy.add(im);
  }
  move(p){
    if(this.sliding===p.id){this.slideTo(p.x);return;}
    const d=this.drags.get(p.id); if(!d) return;
    const s=this.state[d.r],b=this.beads[d.r];
    d.moved=clamp((p.y-d.y0)/this.k*d.sign,0,d.travel);
    d.group.forEach((im,i)=>im.y=d.bases[i]+d.moved*d.sign);
    // one-finger pinch: slide the TOP bead down THROUGH the bar into the bottom beads (touch + mouse);
    // the reverse is mouse-only. Both need a long deliberate slide.
    if(!d.pushingIn) return;
    const rel=this.localY(p);
    if(d.kind==='e'&&!s.h&&!d.touch){
      const pushed=(d.y0-p.y)/this.k;
      const want=rel<H_OFF+AB.BH && pushed>AB.TRAVEL+AB.BH*1.5;
      if(want!==d.crossH){d.crossH=want;this.preview(d,b.h,want,yH(want));}
    }
    if(d.kind==='h'&&s.e<4){
      let kk=-1;
      const pulled=(p.y-d.y0)/this.k;
      if(rel>E_FREE0 && pulled>AB.TRAVEL+AB.BH*1.5) kk=Math.max(s.e,Math.min(3,Math.floor((rel-E_FREE0)/AB.BH)));
      if(kk!==d.crossK){d.crossK=kk;
        b.e.forEach((im,i)=>{if(i<s.e)return;const on=kk>=0&&i<=kk;this.preview(d,im,on,yE(i,on));});}
    }
  }
  up(p){
    if(this.sliding===p.id){this.sliding=null;return;}
    const d=this.drags.get(p.id); if(!d) return; this.drags.delete(p.id);
    const s=this.state[d.r],b=this.beads[d.r];
    d.group.forEach(im=>{this.busy.delete(im);im.setScale(1);});
    [b.h,...b.e].forEach(im=>{if(!d.group.includes(im)&&this.busy.has(im)&&![...this.drags.values()].some(o=>o.group.includes(im))){this.busy.delete(im);}im.setTint(0xffffff);});
    const committed=d.moved>d.travel*0.35||d.crossH||d.crossK>=0;
    if(committed){
      if(d.kind==='h'){s.h^=1;this.record(d.r,1);} else {s.e=d.k<s.e?d.k:d.k+1;this.record(d.r,2);}
      if(d.crossH){s.h=1;this.record(d.r,1);}
      if(d.crossK>=0){s.e=d.crossK+1;this.record(d.r,2);}
      sfx.clack();
    }
    this.update(); this.endGesture();
    if(committed&&this.opts.onChange) this.opts.onChange(this.value());
  }
  update(instant){
    for(let r=0;r<this.n;r++){
      const s=this.state[r],b=this.beads[r];
      const go=(im,y)=>{if(this.busy.has(im))return;this.s.tweens.killTweensOf(im);
        if(instant){im.y=y;return;} if(Math.abs(im.y-y)<.5)return;
        this.s.tweens.add({targets:im,y,duration:180,ease:'Back.Out'});};
      go(b.h,yH(s.h));b.e.forEach((im,k)=>go(im,yE(k,k<s.e)));
      if(this.digitT[r]) this.digitT[r].setText(this.opts.hideDigits?'?':String(s.h*5+s.e));
    }
    this.glowG.clear();
    (this.opts.glow||[]).forEach(place=>{const r=this.u-place;if(r<0||r>=this.n)return;const x=this.rodX[r];
      this.glowG.fillStyle(C.yellow,.4).fillRoundedRect(x-AB.RW/2+8,AB.PAD+4,AB.RW-16,AB.ROD_H-8,12);});
  }
  // whole-number part from the rods up to the unit rod, decimals from the rods after it
  value(){
    let iv=0; for(let r=0;r<=this.u;r++) iv=iv*10+this.dig(r);
    let dec=''; for(let r=this.u+1;r<this.n;r++) dec+=this.dig(r);
    dec=dec.replace(/0+$/,''); return dec?Number(iv+'.'+dec):iv;
  }
  set(n,instant){this.state=this.digitsFor(n).map(d=>({h:d>=5?1:0,e:d%5}));this.update(instant);this.resetTechnique();}
  animateTo(n,cb){const D=this.digitsFor(n);let r=0;
    const step=()=>{if(this.dead)return;
      while(r<this.n&&this.dig(r)===D[r]) r++;
      if(r>=this.n){this.resetTechnique();cb&&cb();return;}
      this.scrollToRod(r);const d=D[r];this.state[r]={h:d>=5?1:0,e:d%5};this.update();sfx.clack();r++;this.s.time.delayedCall(380,step);};
    step();}
  // ---------- teaching animations ----------
  moveCaption(place,s0,h1,e1){
    const S=L().soro,p=placeName(place),dh=h1-s0.h,de=e1-s0.e;
    if(dh&&de) return S.both(p,dh,de);
    if(dh>0) return S.hDown(p); if(dh<0) return S.hUp(p);
    if(de>0) return S.eUp(p,de); if(de<0) return S.eDown(p,-de);
    return S.zero(p);
  }
  // Move one rod to digit d slowly with fingers, the way it's taught:
  // thumb pushes bottom beads UP; index finger pulls bottom beads DOWN and moves the top bead;
  // when top and bottom beads both change, both fingers move at the same time (pinch).
  fingerMove(r,d,cb,dur=950){
    const s0=this.state[r],h1=d>=5?1:0,e1=d%5,b=this.beads[r],x=this.rodX[r],tw=[],used=[];
    const finger=(f,glyph,fx,y0,y1)=>{this.s.tweens.killTweensOf(f);f.setText(glyph).setPosition(fx,y0).setAlpha(0);
      used.push(f);this.s.tweens.add({targets:f,alpha:1,duration:220});tw.push({targets:f,y:y1});};
    if(s0.h!==h1){
      this.s.tweens.killTweensOf(b.h);this.busy.add(b.h);tw.push({targets:b.h,y:yH(h1)});
      if(h1) finger(this.fIndex,'👇',x+10,yH(0)-22,yH(1)-22);
      else   finger(this.fIndex,'☝️',x+10,yH(1)+AB.BH+22,yH(0)+AB.BH+22);
    }
    if(s0.e!==e1){
      const up=e1>s0.e,lo=Math.min(s0.e,e1),hi=Math.max(s0.e,e1);
      b.e.slice(lo,hi).forEach((im,i)=>{this.s.tweens.killTweensOf(im);this.busy.add(im);tw.push({targets:im,y:yE(lo+i,up)});});
      if(up) finger(this.fThumb,'👆',x-10,yE(hi-1,false)+AB.BH+22,yE(hi-1,true)+AB.BH+22);
      else   finger(this.fThumb,'👇',x-10,yE(lo,true)-22,yE(lo,false)-22);
    }
    if(!tw.length){this.s.time.delayedCall(350,()=>cb&&cb());return;}
    const pinch=s0.h!==h1&&s0.e!==e1;
    this.s.time.delayedCall(320,()=>{ if(this.dead) return;
      tw.forEach(t=>this.s.tweens.add({...t,duration:dur,ease:'Sine.InOut'}));
      sfx.clack(); if(pinch){sfx.pinch();this.toast(L().pinch);}
      this.s.time.delayedCall(dur+60,()=>{ if(this.dead) return;
        this.state[r]={h:h1,e:e1};[b.h,...b.e].forEach(im=>this.busy.delete(im));this.update(true);sfx.clack();
        used.forEach(f=>this.s.tweens.add({targets:f,alpha:0,duration:260}));
        this.s.time.delayedCall(320,()=>cb&&cb());
      });
    });
  }
  runSteps(steps,onStep,done){
    let i=0;
    const next=()=>{ if(this.dead) return;
      if(i>=steps.length){done&&done();return;}
      const st=steps[i++]; this.opts.glow=st.place!==undefined?[st.place]:[]; this.update();
      if(st.place!==undefined) this.scrollToRod(this.u-st.place);
      if(st.t) onStep&&onStep(st.t);
      st.run(()=>this.s.time.delayedCall(st.pause??600,next));
    };
    next();
  }
  // Ketik Angka: clear, then set each rod from the left with finger moves
  sorobanTo(n,onStep,done){
    if(this.animating||this.demoing) return; this.animating=true;
    const wasLocked=this.locked; this.lock(true);
    const S=L().soro,D=this.digitsFor(n),steps=[];
    if(this.value()>0) steps.push({t:S.clear,pause:350,run:cb=>{this.state.forEach(st=>{st.h=0;st.e=0;});this.update();sfx.clack();this.s.time.delayedCall(700,cb);}});
    let first=D.findIndex(d=>d>0); if(first<0||first>this.u) first=this.u;
    for(let r=first;r<=this.u;r++){
      const d=D[r],place=this.u-r;
      steps.push({place,t:this.moveCaption(place,{h:0,e:0},d>=5?1:0,d%5),pause:500,
        run:cb=>d===0?this.s.time.delayedCall(700,cb):this.fingerMove(r,d,cb)});
    }
    steps.push({t:S.done(n),pause:10,run:cb=>{sfx.good();cb();}});
    this.runSteps(steps,onStep,()=>{this.opts.glow=this.baseGlow.slice();this.update();this.animating=false;this.lock(wasLocked);this.resetTechnique();done&&done();});
  }
  // "Contohkan" / Help: show how to get from the current beads to n, then put the beads back
  demo(n,onStep,done){
    if(this.demoing||this.animating) return; this.demoing=true;
    const saved=this.state.map(s=>({...s})),savedScroll=this.scrollX,wasLocked=this.locked; this.lock(true);
    const S=L().soro,D=this.digitsFor(n),cur=this.state.map(s=>({...s}));
    const steps=[{t:S.watch,pause:300,run:cb=>this.s.time.delayedCall(500,cb)}];
    for(let r=0;r<this.n;r++){
      const d=D[r],h1=d>=5?1:0,e1=d%5,place=this.u-r;
      if(cur[r].h===h1&&cur[r].e===e1) continue;
      steps.push({place,t:this.moveCaption(place,cur[r],h1,e1),pause:650,run:cb=>this.fingerMove(r,d,cb,1100)});
      cur[r]={h:h1,e:e1};
    }
    steps.push({t:S.yourTurn,pause:1500,run:cb=>{sfx.good();cb();}});
    this.runSteps(steps,onStep,()=>{ if(this.dead) return;
      this.state=saved;this.opts.glow=this.baseGlow.slice();this.update();if(this.scrolls)this.tweenScroll(savedScroll);
      this.lock(wasLocked);this.demoing=false;this.resetTechnique();done&&done();});
  }
  reveal(){this.opts.hideDigits=false;this.update();}
  lock(v){this.locked=v;}
}

function explain(n,rods){
  const s=String(n).padStart(rods,'0'),out=[];
  for(let k=0;k<rods;k++){const d=+s[k];out.push(`${placeName(rods-1-k)} ${d} → ${L().digit(d)}`);}
  return out.join('\n');
}
const placeNames=list=>list.map(p=>placeName(p)).join(L().and);

class Boot extends Phaser.Scene{
  constructor(){super('Boot')}
  create(){
    [...BEAD_COLORS,BEAD_BROWN].forEach(([light,dark],i)=>{
      const g=this.make.graphics({x:0,y:0,add:false}),w=AB.BW,h=AB.BH;
      const P=a=>a.map(([x,y])=>({x,y}));
      const hex=[[w*.2,1],[w*.8,1],[w-1,h/2],[w*.8,h-1],[w*.2,h-1],[1,h/2]];
      g.fillStyle(dark,1).fillPoints(P(hex),true);
      g.fillStyle(light,1).fillPoints(P([[w*.2,1],[w*.8,1],[w-1,h/2],[1,h/2]]),true);
      g.fillStyle(0xffffff,.5).fillEllipse(w/2,h*.2,w*.5,h*.16);
      g.fillStyle(0x000000,.12).fillRect(w/2-3,0,6,h);            // the rod hole
      g.lineStyle(2,Phaser.Display.Color.ValueToColor(dark).darken(15).color,1).strokePoints(P(hex),true);

// ---------------------------------------------------------------- CHALLENGE (full sempoa practice)
// 10 questions: show a number, or work out a sum step by step on a 13-rod sempoa.
const PPLAN=[{t:'build',a:[1]},{t:'build',a:[2]},{t:'calc',a:[1,1],ops:'+'},{t:'calc',a:[1,1],ops:'-'},{t:'calc',a:[1,1,1]},
  {t:'build',a:[3]},{t:'calc',a:[2,2],ops:'+'},{t:'calc',a:[2,2],ops:'-'},{t:'calc',a:[2,2,2]},{t:'calc',a:[3,2]}];
const rndDigits=d=>d===1?rnd(1,9):rnd(10**(d-1),10**d-1);
function makeQ(P){
  if(P.t==='build') return {type:'build',answer:rndDigits(P.a[0])};
  for(let t=0;t<500;t++){
    const terms=[rndDigits(P.a[0])],totals=[terms[0]]; let tot=terms[0],ok=true;
    for(let i=1;i<P.a.length;i++){
      const op=P.ops||pickOne(['+','-']),v=rndDigits(P.a[i]),nt=op==='+'?tot+v:tot-v;
      if(nt<0||nt>9999){ok=false;break;}
      terms.push(op==='+'?v:-v); tot=nt; totals.push(tot);
    }
    if(ok) return {type:'calc',terms,totals,answer:tot};
  }
  return {type:'build',answer:rnd(1,9)};
}
const fmtTerm=(v,i)=>i===0?String(v):(v<0?`− ${-v}`:`+ ${v}`);
const fmtExpr=Q=>Q.type==='build'?String(Q.answer):Q.terms.map(fmtTerm).join(' ')+` = ${Q.answer}`;
const fmtTime=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const FULL_RODS=13, FULL_UNIT=9;

class Challenge extends Phaser.Scene{
  constructor(){super('Challenge')}
  create(data){
    drawBg(this); const T=L();
    this.qs=PPLAN.map(makeQ); this.qi=0; this.score=0; this.combo=1; this.streak=0; this.best=0; this.correct=0; this.results=[];
    this.tStart=this.time.now; this.burst=confetti(this);
    // ---- left panel: progress, timer, the sum ----
    panel(this,26,26,282,GH-52,0xf3fbfe,0xcdeefa,24);
    btn(this,74,68,70,54,0xffffff,'✕',()=>this.scene.start('Home'),{white:true,size:28,textColor:'#24323d'});
    this.progT=txt(this,288,68,'1/10',32,'#24323d',{ox:1});
    this.timeT=txt(this,288,110,'⏱ 00:00',22,'#5b6b77',{ox:1,body:true});
    const dg=this.add.graphics();dg.lineStyle(3,C.line,1).lineBetween(44,140,290,140);
    this.scoreT=txt(this,48,GH-62,'⭐ 0',24,'#24323d',{ox:0});
    this.comboT=txt(this,288,GH-62,'🔥 x1',24,'#e0520a',{ox:1});
    // ---- right side buttons ----
    optionsButton(this,{},T.restartNote,GW-66,52);
    const side=(y,icon,label,cb,color,size=34,h=72)=>{
      btn(this,GW-66,y,92,h,color,icon,cb,{white:color===0xffffff,size,textColor:color===0xffffff?'#2f7f93':'#ffffff',radius:24});
      txt(this,GW-66,y+h/2+20,label,17,'#5b6b77',{body:true});
    };
    side(170,'❓',T.guide,()=>openGuide(this),0xffffff);
    side(300,'💡',T.help,()=>this.help(),0xffffff);
    side(440,'✔',T.submit,()=>this.submit(),C.green,40,88);
    side(590,'⏭',T.skip,()=>this.skip(),0xffffff);
    // ---- the full sempoa ----
    this.abCX=736; this.viewW=760;
    this.capT=txt(this,this.abCX,GH-46,T.hintShort,18,'#7b8a95',{body:true,wrap:760});
    this.objs=[]; this.loadQ();
    if(data&&data._opts) openOptions(this,data,T.restartNote);
  }
  clearQ(){this.objs.forEach(o=>o.destroy());this.objs=[];if(this.ab){this.ab.destroy();this.ab=null;}if(this.sh){this.sh.destroy();this.sh=null;}}
  loadQ(){
    this.clearQ(); const Q=this.qs[this.qi],T=L(); this.answered=false; this.cur=0; this.qStart=this.time.now;
    this.progT.setText(`${this.qi+1}/10`);
    const o=this.objs;
    if(Q.type==='build'){
      o.push(txt(this,48,180,T.showNum,22,'#5b6b77',{ox:0,body:true}));
      const big=txt(this,167,290,String(Q.answer),84,'#ff6a1a',{stroke:'#ffffff',st:8});o.push(big);
      this.tweens.add({targets:big,scale:{from:.4,to:1},duration:400,ease:'Back.Out'});
    } else {
      this.rows=[];
      Q.terms.forEach((v,i)=>{
        const y=180+i*64,pill=panel(this,40,y-28,254,56,0xdbe9ff,null,16);
        const mark=txt(this,64,y,'▶',22,'#2a6fd6');
        const val=txt(this,284,y,fmtTerm(v,i),40,'#24323d',{ox:1});
        o.push(pill,mark,val); this.rows.push({pill,mark,val});
      });
      const ey=180+Q.terms.length*64+6;
      const lg=this.add.graphics();lg.lineStyle(3,C.line,1).lineBetween(44,ey-30,290,ey-30);o.push(lg);
      const pill=panel(this,40,ey-28,254,56,0xdbe9ff,null,16);
      const eq=txt(this,64,ey,'=',30,'#24323d');
      this.ansT=txt(this,284,ey,'?',40,'#24323d',{ox:1});
      o.push(pill,eq,this.ansT); this.rows.push({pill,mark:eq,val:this.ansT,eq:true});
      this.highlight();
    }
    this.ab=new Abacus(this,this.abCX,78,FULL_RODS,{unit:FULL_UNIT,scale:1.1,viewW:this.viewW,labels:'none',onChange:v=>this.onBeads(v)});
    this.capT.setText(L().hintShort).setColor('#7b8a95');
  }
  // the ▶ follows the running total: show 3, then the sempoa must show 3+5, …
  highlight(){
    const Q=this.qs[this.qi]; if(Q.type!=='calc') return;
    this.rows.forEach((r,i)=>{const on=i===this.cur,done=i<this.cur;
      r.pill.setVisible(on);
      if(!r.eq){r.mark.setText(done?'✓':'▶').setColor(done?'#1b9b62':'#2a6fd6').setVisible(on||done);r.val.setColor(done?'#8c99a3':'#24323d');}
    });
  }
  onBeads(v){
    const Q=this.qs[this.qi]; if(this.answered||Q.type!=='calc') return;
    if(this.cur<Q.totals.length&&v===Q.totals[this.cur]){this.cur++;sfx.ding();this.highlight();}
  }
  update(){ if(this.timeT) this.timeT.setText('⏱ '+fmtTime((this.time.now-this.tStart)/1000)); }
  help(){
    if(this.answered||!this.ab||this.ab.demoing) return;
    const Q=this.qs[this.qi];
    const target=Q.type==='build'?Q.answer:Q.totals[Math.min(this.cur,Q.totals.length-1)];
    this.capT.setColor('#2f7f93');
    this.ab.demo(target,t=>this.capT.setText(t),()=>this.capT.setText(L().hintShort).setColor('#7b8a95'));
  }
  submit(){
    if(this.answered||!this.ab||this.ab.demoing) return;
    const Q=this.qs[this.qi],T=L(),given=this.ab.value();
    const errs=Q.type==='build'?this.ab.techniqueErrors():[];
    const rightNum=given===Q.answer, ok=rightNum&&!errs.length;
    this.answered=true; this.ab.lock(true);
    const secs=(this.time.now-this.qStart)/1000;
    let kind,emoji,title,body=Q.type==='build'?explain(Q.answer,String(Q.answer).length):`${fmtExpr(Q)}\n${T.yourBeads(given)}`;
    if(this.ansT) this.ansT.setText(String(Q.answer)).setColor(ok?'#1b9b62':'#d93355');
    if(Q.type==='calc'){this.cur=Q.terms.length;this.highlight();}
    if(ok){
      this.correct++;this.streak++;this.best=Math.max(this.best,this.streak);
      const gained=(100+Math.max(0,Math.round((60-secs)*2)))*this.combo;this.score+=gained;this.combo=Math.min(5,this.combo+1);
      kind='good';emoji=pickOne(['🥳','😎','🤩','🦄']);title=pickOne(T.praise)+`  +${gained}`;
      sfx.good();this.burst(60);
    } else {
      this.streak=0;this.combo=1;kind='bad';emoji='🤔';
      title=rightNum?T.noPinchT:`${pickOne(T.cheer)} ${T.answerIs(Q.answer)}`;
      if(rightNum) body=T.noPinchB(placeNames(errs))+'\n'+body;
      sfx.bad();this.cameras.main.shake(220,.006);
      if(!rightNum) this.time.delayedCall(500,()=>this.ab&&this.ab.animateTo(Q.answer));
    }
    this.results.push({Q,ok,given,noPinch:rightNum&&!ok});
    this.afterAnswer(kind,emoji,title,body);
  }
  skip(){
    if(this.answered||!this.ab||this.ab.demoing) return;
    const Q=this.qs[this.qi],T=L(); this.answered=true; this.ab.lock(true);
    this.streak=0;this.combo=1;
    if(this.ansT) this.ansT.setText(String(Q.answer)).setColor('#8c99a3');
    this.results.push({Q,ok:false,skipped:true});
    this.time.delayedCall(300,()=>this.ab&&this.ab.animateTo(Q.answer));
    this.afterAnswer('info','⏭',T.skipped,`${fmtExpr(Q)}`);
  }
  afterAnswer(kind,emoji,title,body){
    const T=L(),last=this.qi===this.qs.length-1;
    this.scoreT.setText('⭐ '+this.score);this.comboT.setText('🔥 x'+this.combo);
    this.sh=sheet(this,{kind,emoji,title,body,btnLabel:last?'🏆':T.next,onBtn:()=>{
      if(last){
        const b=+store.get('sempoaBest','0');if(this.score>b)store.set('sempoaBest',String(this.score));
        this.scene.start('Result',{score:this.score,correct:this.correct,best:this.best,results:this.results,time:(this.time.now-this.tStart)/1000});
      } else if(this.answered&&this.qi<this.qs.length-1){this.qi++;this.loadQ();}
    }});
  }
}

    this.valT=txt(this,167,175,'0',56,'#2a9fc4');
    this.wordT=txt(this,167,230,'',20,'#5b6b77',{body:true,wrap:250,oy:0});
    btn(this,167,540,240,70,0xffffff,T.clear,()=>{this.ab.set(0);this.show(0)},{white:true,textColor:'#2f7f93',size:24});
    btn(this,167,630,240,70,C.orange,T.surprise,()=>{const n=rnd(1,99999);this.ab.set(0,true);this.ab.animateTo(n,()=>this.show(n))},{size:24});
    this.show(0);
  }
  show(v){ if(!this.valT) return;
    const s=String(v); this.valT.setText(s).setFontSize(s.length>7?36:s.length>5?46:56);
    this.wordT.setText(Number.isInteger(v)?L().words(v):''); }
  // --- mode 2: type a number, watch the sempoa set it step by step
  buildInput(){
    const T=L(); this.entry='';
    this.ab.lock(true); // in this mode the beads only move by themselves
    panel(this,44,120,246,70,0xffffff,0xffd0b5,18);
    this.inT=txt(this,167,155,'_',44,'#ff6a1a');
    const keys=[['1','2','3'],['4','5','6'],['7','8','9'],['C','0','⌫']];
    keys.forEach((row,ri)=>row.forEach((k,ci)=>{
      const fn=k==='⌫'||k==='C';
      btn(this,87+ci*80,240+ri*66,72,56,fn?0xffffff:C.blue,k,()=>this.key(k),{white:fn,textColor:fn?'#2f7f93':'#ffffff',size:30,radius:16});
    }));
    this.goBtn=btn(this,167,530,240,68,C.orange,T.show,()=>this.go(),{size:26});
    this.capT=txt(this,167,580,T.typeHint,18,'#2f7f93',{body:true,wrap:250,oy:0});
  }
  key(k){
    if(this.ab.animating) return;
    if(k==='⌫') this.entry=this.entry.slice(0,-1);
    else if(k==='C') this.entry='';
    else if(this.entry.length<9) this.entry=(this.entry+k).replace(/^0+(?=\d)/,'');
    this.inT.setText(this.entry||'_').setFontSize(this.entry.length>6?32:44);
  }
  go(){
    if(this.ab.animating) return;
    if(this.entry===''){this.tweens.add({targets:this.inT,x:177,yoyo:true,repeat:2,duration:50});return;}
    const n=+this.entry; this.goBtn.setEnabled(false);
    this.ab.sorobanTo(n,t=>this.capT.setText(t),()=>{
      this.capT.setText(`${L().soro.done(n)}\n${L().words(n)}`);this.goBtn.setEnabled(true);
    });
  }
}

const config={
  type:Phaser.AUTO, parent:'game', width:GW, height:GH, backgroundColor:'#ffd59a',
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  input:{activePointers:4},
  scene:[Boot,Home,Learn,Cert,Challenge,Result,Free]
};
const fontsReady=(document.fonts&&document.fonts.load)
  ? Promise.race([Promise.all([document.fonts.load('800 40px "Baloo 2"'),document.fonts.load('700 24px "Nunito"'),document.fonts.load('800 24px "Nunito"')]).catch(()=>{}),new Promise(r=>setTimeout(r,2500))])
  : Promise.resolve();
fontsReady.then(()=>new Phaser.Game(config));
}
// wait for the engine (it may come from the fallback CDN) before defining scenes
(function wait(t0){
  if(window.Phaser) return SEMPOA();
  if(Date.now()-t0>12000){document.getElementById('loading').textContent='Could not load the game engine 😢';return;}
  setTimeout(()=>wait(t0),100);
})(Date.now());
